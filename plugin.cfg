[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Volkswagen ID Plugin Authors
EMAIL=volkswagenid@users.noreply.github.com

[PLUGIN]
VERSION=0.9.12
NAME=volkswagenid
FOLDER=volkswagenid
TITLE=Volkswagen ID

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository.
#
# Die Fassung bleibt bewusst in der Reihe 0.9.x: solange nichts an einem echten
# Konto und Fahrzeug erprobt ist, gibt es keine 1.0.0. Angeboten wird ein
# Update nur, wenn die Fassung im Zweig hoeher steht als die installierte.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-VolkswagenID/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-VolkswagenID/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
