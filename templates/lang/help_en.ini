; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Volkswagen ID"
K02 = "Connects Volkswagen vehicles to Loxone through the Volkswagen account: state of charge, range, odometer, locking, doors and windows, lights, handbrake, vehicle state, climate control, window heating, charging values, location and the inspection and oil service intervals. Climate control, charging, charge limit, charging current and window heating can be switched if you wish."
K03 = "It is built for the <b>ID range</b> (ID.3, ID.4, ID.5, ID.7, ID.Buzz). It also works with other connected Volkswagen models — the purely electric values then stay empty and the combustion values are filled in. On a plug-in hybrid the plugin carries both."
K04 = "Two limits worth knowing beforehand"
K05 = "<b>Europe.</b> The connector used here talks to the European service. There is a separate connector for North American vehicles, which is <b>not</b> built in here."
K06 = "<b>Two-factor confirmation.</b> Some accounts demand it at login. That cannot be automated; anyone affected signs in once in a browser on the same device."
K07 = "Polling interval: at least 180 seconds"
K08 = "That is not caution on this plugin's part but the lower limit of the library — below that it will not even accept the setting. Five minutes is a good starting point. If a value is needed immediately, the fetch command is the right way, not a shorter interval."
K09 = "Credentials"
K10 = "These are the credentials of the <b>Volkswagen account</b> — the same ones as in the <i>Volkswagen</i> or <i>We Connect ID</i> app. They are kept in a file of their own with permissions 0600 and never appear in the Loxone project file. The password is never displayed; the <i>Test</i> tab only shows its length."
K11 = "After the first login the library stores tokens and signs in with those instead of sending the password every time. After a password change they are worthless — for that the <i>Settings</i> tab has the button <i>Force new login</i>."
K12 = "How to proceed"
K13 = "<b>Settings:</b> enter user name and password, save, then <i>Start service</i>."
K14 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K15 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver. <b>This applies to MQTT&#8209;gateway&nbsp;V1.</b> From version&nbsp;2 onwards the topic group appears in the subscriptions on its own; there is nothing to enter."
K16 = "<b>Loxone integration:</b> step by step, with a complete list of blocks to rebuild it."
K17 = "If doors and locking stay empty"
K18 = "Some vehicles do not report the <i>ACCESS</i> capability but still supply the values. For that the <i>Settings</i> tab has the tick box <i>Force door state</i>. Only switch it on if those fields would otherwise stay empty."
K19 = "Control"
K20 = "Writing commands are <b>locked</b> by default and have to be released explicitly. Locking and unlocking as well as the horn and headlight flash are deliberately <b>not</b> offered by this plugin. Important: a reply of <i>OK=1</i> means the Volkswagen server has accepted the job — whether the vehicle carries it out only shows on the next fetch."
K21 = "What has not been tested"
K22 = "This plugin was built without a Volkswagen account and without a vehicle. What is untested is therefore whether the login succeeds, whether a given vehicle supplies all the values queried and whether the writing commands have the expected effect. The mapping of the values themselves, by contrast, was measured against real objects of the library. If a value stays empty, the <i>View raw data as JSON</i> button on the <i>Test</i> tab shows what the service actually received."
K23 = "Basis"
K24 = "The connection uses the libraries <i>carconnectivity</i> and <i>carconnectivity-connector-volkswagen</i> by tillsteinbach (MIT). They are not an official Volkswagen interface and may change at any time."
K25 = "What is new in version 0.9.10"
K26 = "A marker in every form protects against a foreign page triggering something in the browser of a signed-in operator. A heartbeat tells you whether the service is still working - a process number does not answer that. There are templates for all five endpoints, for the switching commands and for the MQTT path, plus a History tab with a charging log and consumption. Also new are locking and unlocking, horn and light flash behind a second checkbox, a charging recommendation derived from a foreign MQTT topic, and pre-conditioning before departure."
K27 = "The second checkbox"
K28 = "Locking and unlocking, horn and light flash sit behind their own switch in the Settings tab, which is off by default. They open the car or make it conspicuous, and that is a different matter from climate control. Locking and unlocking additionally requires the four-digit S-PIN. Whether the Volkswagen connector offers these commands at all could not be measured without a car; if it does not, the service says so in plain words."
K29 = "Rate limiting"
K30 = "Volkswagen rejects excessive requests with HTTP 429, and knocking at the same rate afterwards extends the block. Three limits can be configured: the minimum gap between two immediate polls, the number of write commands per hour, and a debounce that does not send the same command carrying the same value twice. A different value always goes through at once. For surplus charging the debounce matters: Loxone delivers the same setpoint every second."
K31 = "What is calculated and what is measured"
K32 = "The energy added and the consumption are calculated, not measured: from the change in state of charge and the nominal battery capacity. Charging losses in the cable and the charger are not included, so a meter at the wallbox will show more. Consumption is only calculated from twenty kilometres driven onwards - below that the figure is noise, because the state of charge is reported in whole per cent only."
