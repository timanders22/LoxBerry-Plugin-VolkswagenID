ABFAHRT_ERKLAERUNG = "Horcht auf ein Thema, das die Restzeit bis zur nächsten Abfahrt in Minuten führt — etwa das des Abfahrts-Assistenten. Fällt sie unter den Vorlauf, wird die Klimatisierung <b>einmal</b> je Abfahrt angefordert. Der Merker wird erst zurückgesetzt, wenn die Restzeit wieder über dem Vorlauf liegt; ohne ihn liefe die Anforderung im Takt weiter, und Volkswagen sperrt ein Konto, das zu oft schreibt."
BREMSE_ERKLAERUNG = "Volkswagen weist zu häufige Anfragen mit HTTP 429 ab, und wer im gleichen Takt weiter anklopft, verlängert die Sperre. Besonders beim Überschussladen ist das eine reale Gefahr: Loxone liefert denselben Ladestrom-Sollwert im Sekundentakt, und daraus entstünden ohne Entprellung dreitausend Schreibbefehle in der Stunde. Ein gedrosselter Befehl wird <b>abgewiesen und gemeldet</b>, nicht stillschweigend verschluckt."
DIENST_ERKLAERUNG = "Der Dienst holt die Werte im eingestellten Takt aus der Volkswagen-Schnittstelle und legt sie ab. Oberfl&auml;che und Miniserver lesen nur das Abgelegte &mdash; sie sprechen nie selbst mit dem Anbieter."
