EINGREIFEND_OHNE_SPIN = "Eingreifende Befehle sind zugelassen, aber es ist <b>keine vierstellige S-PIN</b> hinterlegt. Hupe und Lichthupe gehen trotzdem; Ver- und Entriegeln wird abgewiesen, bis die S-PIN eingetragen ist."
