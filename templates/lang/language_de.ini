[BAUSTEIN]
HINWEISE_TITEL = "Hinweise"
S1_H1 = "Die Störmeldung kommt nach 10 Minuten ohne frische Daten. Ein stehender LoxBerry fällt erst nach gut einer Stunde auf (Nr. 15, Tmc 3900 s): bei einem langen Cloud-Ausfall wartet der Dienst selbst bis zu einer Stunde, und so lange steht auch der Laufzähler."
S1_H2 = "Zu Nr. 15: steht der LoxBerry, behalten alle Eingänge ihren letzten Wert, auch VW_1_OK; nur der stehende Laufzähler VW_1_ZAEHLER verrät es."
S1_H3 = "Zu Nr. 22, 24 und 27: ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung vor der Meldung schluckt ihn. Nie einen Schwellwertschalter direkt an eine Benachrichtigung hängen."
S1_H4 = "Verbrenner: Formel Nr. 21 an VW_1_TANK statt VW_1_SOC hängen und den Text von Nr. 28 anpassen. Ein Wert 0 (nie geliefert, vor dem ersten Abruf) zählt nicht als niedrig."
S1_H5 = "„Meldung Ladung beendet“ kommt bei jedem Ladeende – auch beim Kabelziehen und bei jeder Pause von „Laden nach Empfehlung“ (Seite „VolkswagenID Laden“). Wer das nicht will, legt ein UND mit negiertem „Empfehlung hält an (VW)“ davor."
S1_H6 = "Zweites Fahrzeug: im Reiter „%s“ die Vorlagen für Fahrzeug 2 holen (Namen VW_2_…, Behälter „Volkswagen 2 …“) und die Seiten mit diesen Namen kopieren; die Störung des zweiten Autos über ein weiteres ODER vor Nr. 18 führen."
S1_H7 = "Nach „%s“ im Plugin die Adresse an allen fünf Behältern erneuern (oder die Vorlagen neu holen – dann aber alle Leitungen neu ziehen)."
S1_SCHRITT1 = "Im Plugin Reiter „%s“ die Zugangsdaten des Volkswagen-Kontos eintragen, speichern und „%s“ drücken. Für die Aussage „zu Hause“ im Abschnitt „%s“ den Heimatort eintragen. Reiter „%s“ → „%s“: es kommt eine Zeile VOLKSWAGEN;OK=1;SOC=…"
S1_SCHRITT2 = "Reiter „%s“ → „%s“ → für Fahrzeug 1 die Vorlagen „%s“, „%s“, „%s“ und „%s“ sowie „%s“ herunterladen. In Loxone Config die vier Eingangsvorlagen: im Baum „Virtuelle Eingänge“ wählen, Menüband „Vordefinierte HTTP-Geräte → Vorlage importieren…“; die Befehle: Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“. Jede nur EINMAL einlesen (zweimal ergibt doppelte Bausteine). Die Positionsvorlage wird nicht gebraucht."
S1_SCHRITT3 = "Seite „VolkswagenID“ anlegen. Aus dem Behälter „Volkswagen 1 Status“ die Befehle Nr. 1–10 ziehen, aus „Volkswagen 1 Laden“ Nr. 11–13, dazu die Konstante 1 (Nr. 14, Baustein-Suche F5, Wert 1)."
S1_SCHRITT4 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Auto gestört (VW)“, „Meldung Ladestand niedrig (VW)“ und „Meldung Ladung beendet (VW)“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. An der Analogwertvalidierung Nr. 15 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 26: den Eingang I2 negieren – in Config auf seinen Eingangspunkt klicken, danach zeigt er einen kleinen Kreis. Status „Zustand (VW)“: vorher zweimal „+“ klicken, „Ladestand und Reichweite (VW)“ viermal; die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. Flankenerkennung Nr. 31: die Benachrichtigung an den Ausgang Off. An VW_1_SOC und VW_1_REICHW im Eigenschaftsfenster „Statistik“ einschalten."
S1_SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (VW)“ zeigt „läuft – Werte … s alt“, und VW_1_ZAEHLER zählt mit jedem Abruf weiter."
S2_H1 = "„Laden nach Empfehlung“ braucht im Plugin im Abschnitt „%s“ ein MQTT-Thema (zum Beispiel die Netzleistung) und einen Grenzwert, dazu den Heimatort – sonst bleibt UND Nr. 31 aus. Das Plugin rechnet nur die Empfehlung; Loxone startet und hält an."
S2_H2 = "Mit EVCC an der Wallbox beide Schalter aus lassen – dort regelt EVCC (Seiten „EVCC …“); zwei Regler am selben Auto arbeiten gegeneinander."
S2_H3 = "„Laden von Hand (VW)“ aus schickt „Laden anhalten“, solange keine Empfehlung lädt (ODER Nr. 35). Wer nur nach Empfehlung lädt, lässt ihn aus."
S2_H4 = "Schieberegler in der App loslassen statt ziehen: jeder neue Wert ist ein Befehl, und das Plugin lässt höchstens 30 je Stunde durch."
S2_H5 = "Ladestrom: das Muster kennt nur 6 und 16 A. Modelle mit Ampere-Stufen (5, 10, 13, 32) im Plugin Reiter „%s“ ausprobieren und den Regler anpassen."
S2_H6 = "Die Energie der Ladebilanz ist gerechnet, nicht gemessen; ein Zähler an der Wallbox zeigt mehr."
S2_SCHRITT1 = "Behälter aus Seite „VolkswagenID“, Schritt 2 (nicht erneut einlesen). Für Ladegrenze, Ladestrom und Laden im Plugin Reiter „%s“ den Haken „%s“ setzen – ab Werk aus; sonst weist das Plugin die Befehle ab."
S2_SCHRITT2 = "Seite „VolkswagenID Laden“ anlegen. 22 Befehle ziehen: Nr. 1, 16 und 17 aus „Volkswagen 1 Status“, Nr. 2–15 aus „Volkswagen 1 Laden“, Nr. 18–22 aus „Volkswagen 1 Verbrauch“ (VW_1_SOC, VW_1_LD_LAEDT, VW_1_LD_FERTIGMIN, VW_1_LD_KABEL und VW_1_ZUHAUSE ein weiteres Mal); dazu aus „Volkswagen 1 Befehle“ die drei Virtuellen Ausgang Befehle Nr. 27, 29 und 36."
S2_SCHRITT3 = "Zwei Schieberegler („Ladegrenze (VW) (Proz)“, „Ladestrom (VW) (A)“) und zwei Schalter („Laden nach Empfehlung (VW)“, „Laden von Hand (VW)“) als Virtuelle Eingänge anlegen, Werte wie in der Liste."
S2_SCHRITT4 = "Übrige Bausteine über F5, von oben nach unten verbinden. „+“ klicken: „Laden (VW)“ viermal, „Ladeanschluss (VW)“ viermal, „Ladebilanz (VW)“ einmal. „Statistik“ an VW_1_LD_LADEKW und VW_1_VB_TAGKWH einschalten."
S2_SCHRITT5 = "Speichern und übertragen. Probe: Kabel einstecken – nach dem nächsten Abruf (bis 5 Minuten) zeigt „Laden (VW)“ „Kabel steckt, lädt nicht“ oder „lädt mit … kW“; „Laden von Hand (VW)“ ein startet die Ladung."
S3_H1 = "Zu Nr. 14 und 15: der Klimabefehl ist analog und braucht die Temperatur als Wert, keinen Impuls. Die Formel liefert sie, solange angefordert ist, sonst -1 – diesen Wert weist das Plugin ohne Wirkung ab. Ausgeschaltet wird über „Klima aus (VW)“ oder den eigenen Zeitablauf des Fahrzeugs."
S3_H2 = "Wer im Plugin die eigene Vorklimatisierung (Abschnitt „%s“, zum Beispiel mit dem Abfahrts-Assistenten) nutzt, lässt die Schaltuhr Nr. 10 weg – sonst fordern zwei Wege an."
S3_H3 = "„VW 1 Zieltemperatur setzen“ bleibt in der Vorlage ungenutzt: „Klima jetzt“ schickt die Temperatur mit."
S3_H4 = "Die Sitzheizung ist nur lesbar; eine Schaltmöglichkeit bietet Volkswagen nicht an. „Fahrzeug wecken“ sparsam benutzen – jeder Weckruf kostet Ruhestrom."
S3_H5 = "Ver- und Entriegeln, Lichthupe und Hupe fehlen bewusst: sie brauchen im Plugin den zweiten Haken „%s“ (und die S-PIN) und gehören nicht auf eine App-Taste. Wer sie will, setzt den Haken und holt die Befehlsvorlage neu."
S3_H6 = "Die Ansagen („Ladung beendet“, „Klimatisierung beendet“, „steht offen“ …) spricht das Plugin selbst (Reiter „%s“, Sprachausgabe, ab Werk aus) – dafür braucht es keinen Baustein."
S3_SCHRITT1 = "Behälter wie auf Seite „VolkswagenID“; Haken „%s“ wie auf Seite „VolkswagenID Laden“ (nur „Jetzt abrufen“ braucht ihn nicht)."
S3_SCHRITT2 = "Seite „VolkswagenID Klima und Befehle“ anlegen. Die 6 Befehle Nr. 1–6 aus „Volkswagen 1 Status“ und die 8 Virtuellen Ausgang Befehle Nr. 15, 17, 19, 21, 23, 25, 27 und 29 aus „Volkswagen 1 Befehle“ ziehen; „Anwesenheit (eigene Quelle)“ aus dem Baum ziehen bzw. einmal als Virtuellen Eingang anlegen und aus der eigenen Anwesenheit speisen."
S3_SCHRITT3 = "Den Schieberegler „Zieltemperatur (VW)“, vier Schalter (Nr. 18, 20, 22, 24) und vier Tasten (Nr. 9, 16, 26, 28) als Virtuelle Eingänge anlegen, Werte wie in der Liste."
S3_SCHRITT4 = "Schaltuhr „Abfahrt vorklimatisieren (VW)“ über F5 setzen und im Schaltuhr-Editor Montag bis Freitag 06:40–07:00 eintragen (eigene Abfahrt: Beginn 20 Minuten vorher, Ende zur Abfahrt); ihr Ausgang AQ geht an UND Nr. 12. Übrige Bausteine über F5. Status „Klima (VW)“: vorher dreimal „+“ klicken."
S3_SCHRITT5 = "Speichern und übertragen. Probe: „Klima jetzt (VW)“ tippen – nach dem nächsten Abruf (bis 5 Minuten) zeigt „Klima (VW)“ „Klimatisierung läuft“; „Klima aus (VW)“ hält sie an."
S4_H1 = "Die Offen-Meldung gilt nur für ein abgestelltes Auto mit frischen Daten (Formel Nr. 25); beim Fahren, vor dem ersten Abruf und bei einer Störung schweigt sie."
S4_H2 = "Ohne Heimatort im Plugin bleiben „zu Hause“ und die Entfernung 0; „Standort und Kilometer (VW)“ sagt dann „Standort unbekannt“."
S4_H3 = "Zu Nr. 29: ein Elektroauto liefert keinen Ölservice; 0 heißt „nicht geliefert“. Eine genau heute fällige Inspektion zählt ebenso – gemeldet wurde sie schon 14 Tage vorher."
S4_H4 = "Zu Nr. 30 und 31: der Schwellwertschalter gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung von 600 s schluckt ihn."
S4_SCHRITT1 = "Behälter wie auf Seite „VolkswagenID“. Die Wartungsvorlage fragt nur stündlich ab – die Werte ändern sich in Tagen."
S4_SCHRITT2 = "Seite „VolkswagenID Fahrzeug“ anlegen. 20 Befehle ziehen: Nr. 1–14 aus „Volkswagen 1 Status“ (VW_1_ZUSTAND, VW_1_OK und VW_1_ZUHAUSE ein weiteres Mal), Nr. 15–20 aus „Volkswagen 1 Wartung“. „Statistik“ an VW_1_KM einschalten."
S4_SCHRITT3 = "Zwei Benachrichtigungen anlegen: „Meldung Fahrzeug offen (VW)“ und „Meldung Service fällig (VW)“, Texte wie in der Liste."
S4_SCHRITT4 = "Übrige Bausteine über F5, von oben nach unten verbinden. „+“ klicken: „Türen und Fenster (VW)“ viermal, „Standort und Kilometer (VW)“ zweimal, „Wartung (VW)“ dreimal."
S4_SCHRITT5 = "Speichern und übertragen. Probe: das abgestellte Auto unverriegelt lassen – nach dem nächsten Abruf und 5 Minuten kommt „Meldung Fahrzeug offen (VW)“."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
