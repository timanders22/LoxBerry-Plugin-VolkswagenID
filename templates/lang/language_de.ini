H_MQTT_RETAIN = "Angehakt merkt sich der Broker jeden Wert. Nach einem Neustart des Miniservers oder des Gateways stehen die virtuellen Eingänge sofort wieder auf dem letzten Stand; ohne diesen Haken bleiben sie leer, bis der nächste Abruf durch ist — bei fünf Minuten Takt also minutenlang. Das Lebenszeichen sagt trotzdem, ob der Wert frisch ist. <b>Nicht am Gerät nachgemessen:</b> dass der UDP-Eingang des Gateways das Befehlswort <span class='sm-mono'>retain</span> annimmt, ist aus drei Schwesterplugins belegt, hier stand kein LoxBerry."
