KONTO_ERKLAERUNG = "Es sind die Zugangsdaten des <b>Volkswagen-Kontos</b> &mdash; dieselben, mit denen Sie sich in der App <i>Volkswagen</i> beziehungsweise <i>We Connect ID</i> anmelden. Nicht die eines H&auml;ndlerportals. Sie werden in einer eigenen Datei mit den Rechten 0600 abgelegt, nicht in der Konfiguration, die diese Seite anzeigt. <b>Zwei Hinweise:</b> Der Connector arbeitet mit <b>europ&auml;ischen</b> Fahrzeugen &mdash; f&uuml;r Nordamerika gibt es einen eigenen, hier nicht eingebauten. Und einzelne Konten verlangen eine Zwei-Faktor-Best&auml;tigung; die l&auml;sst sich nicht automatisieren. Wer davon betroffen ist, meldet sich einmal im Browser auf diesem Ger&auml;t an."
