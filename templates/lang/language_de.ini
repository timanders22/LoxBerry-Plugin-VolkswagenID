NICHT_GEFUNDEN = "In der <span class='sm-mono'>general.json</span> des LoxBerry ist kein MQTT-Abschnitt zu finden. Ohne den kann nichts gesendet werden."
PLATZHALTER = "<b>N</b> steht für die laufende Nummer des Fahrzeugs, also 1 für das erste."
RETAIN_ERKLAERUNG = "Die Spalte <b>Zurückbehalten</b> sagt, ob der Broker den Wert aufhebt. Zustände des Fahrzeugs werden aufgehoben — nach einem Neustart des Miniservers steht der letzte gültige Stand sofort wieder da. Messwerte mit Zeitbezug, Tageswerte, die Ladeempfehlung, das Lebenszeichen und alles, was der <b>Dienst über sich selbst</b> sagt (<span class='sm-mono'>ok</span>, <span class='sm-mono'>fehler_folge</span>, <span class='sm-mono'>fehlertext</span>, <span class='sm-mono'>ausfalltext</span>), werden <b>nicht</b> aufgehoben: ein aufgehobenes „in Ordnung“ bliebe stehen, wenn der Dienst stirbt, und ein aufgehobener Fehlertext bliebe für immer stehen, auch wenn längst wieder alles läuft. Seit Fassung 0.9.24 räumt das Plugin solche Altwerte aus früheren Fassungen einmalig aus dem Broker. Liefert ein gelungener Abruf für einen Zustand keine Aussage, geht <span class='sm-mono'>-</span> hinaus; ein Fahrzeug, das das Konto nicht mehr führt, bekommt einmal <span class='sm-mono'>-</span> auf alle seine zurückbehaltenen Themen."
TEXT_ERKLAERUNG = "Themen mit einem Text bekommen in der Loxone-Vorlage <b>keinen</b> virtuellen Eingang — ein virtueller Eingang ist eine Zahl. Über MQTT sind sie trotzdem nützlich: der Zustandstext sagt <span class='sm-mono'>conservation</span>, wo die Zahl nur 0 sagt."
