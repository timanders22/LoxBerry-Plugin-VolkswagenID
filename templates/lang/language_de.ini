H_EMPFEHLUNG = "Ladeempfehlung"
H_EMPF_KLEINER = "Angehakt für einen Preis (billig ist gut), abgehakt für einen Überschuss (viel ist gut). Thema und Grenze gehören zusammen; eines allein wirkt nicht und wird abgewiesen."
H_EMPF_THEMA = "Vollständiger Themenname, ohne Platzhalter. Leer lassen schaltet die Funktion ab. Die Themen der Spotpreis-Plugins dieses Hauses eignen sich unmittelbar."
H_ENTPRELLUNG = "Derselbe Befehl mit demselben Wert wird innerhalb dieser Zeit nicht noch einmal gesendet. Ein <i>anderer</i> Wert kommt sofort durch — die Bremse verzögert also keine echte Änderung. 0 schaltet sie ab."
H_ERKANNT = "Erkannte Fahrzeuge"
H_HEIMAT = "Heimatort"
H_HEIM_KOORDINATEN = "Dezimalgrad mit Punkt, zum Beispiel <span class='sm-mono'>51.318339</span> und <span class='sm-mono'>9.489601</span>. Beide Felder gehören zusammen: nur eines von beiden ergibt keine Entfernung und wird abgewiesen. Leer lassen schaltet die Funktion ab."
H_HEIM_RADIUS = "Die Ortung eines Fahrzeugs ist auf einige Meter genau, unter Bäumen oder in einer Garage deutlich schlechter. 150 Meter sind ein brauchbarer Anfang; ein zu kleiner Umkreis lässt das Auto in der eigenen Einfahrt flackern."
H_INTERVALL = "Abstand zwischen zwei Abrufen. Zulässig sind 180 bis 3600 Sekunden — 180 ist die Untergrenze der Bibliothek, nicht eine Vorsichtsmaßnahme dieses Plugins."
H_KONTO = "Zugang zum Volkswagen-Konto"
H_MQTT_RETAIN = "Angehakt merkt sich der Broker jeden Wert. Nach einem Neustart des Miniservers oder des Gateways stehen die virtuellen Eingänge sofort wieder auf dem letzten Stand; ohne diesen Haken bleiben sie leer, bis der nächste Abruf durch ist — bei fünf Minuten Takt also minutenlang. Das Lebenszeichen sagt trotzdem, ob der Wert frisch ist. Am LoxBerry gemessen: der UDP-Eingang des Gateways kennt das Befehlswort <span class='sm-mono'>retain</span>, und ein so gesendetes Thema liegt danach im Broker. Das Lebenszeichen wird auch mit Haken nie behalten — ein behaltenes Lebenszeichen sagte immer „lebt“. Seit 0.9.24 gilt dasselbe für alles, was der <b>Dienst über sich selbst</b> sagt (<span class='sm-mono'>ok</span>, <span class='sm-mono'>fehler_folge</span>, <span class='sm-mono'>fehlertext</span>, <span class='sm-mono'>ausfalltext</span>); welches Thema behalten wird, steht in der Spalte <b>Zurückbehalten</b> der Tabelle weiter unten. Beim Deinstallieren werden die behaltenen Themen dieses Plugins geleert."
H_MQTT_TOPIC = "Erlaubt sind Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich. Aus dem Präfix ergeben sich alle Themen, siehe Reiter MQTT."
H_PASSWORT = "Bleibt das Feld leer, bleibt das gespeicherte Passwort unverändert. Es wird nie angezeigt — im Reiter Test steht nur seine Länge."
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_SPIN = "Die vierstellige S-PIN aus der Volkswagen-App. Gebraucht wird sie nur für Ver- und Entriegeln, und das steht hinter dem zweiten Haken im Abschnitt <i>Eingreifende Befehle</i>. Wer diese Befehle nicht nutzt, lässt das Feld leer."
H_STEUERUNG = "Schreibende Befehle"
H_TAKT = "Abholtakt"
H_TAKT_WARTUNG = "Inspektion und Ölservice ändern sich in Tagen, nicht in Minuten. Bei einem Takt von 300 Sekunden bedeutet 12 also: einmal je Stunde."
H_TEMP = "Grenzen für die Klimatisierung. Ein Wert außerhalb wird <b>abgewiesen</b>, nicht auf die Grenze gekappt: ein still veränderter Sollwert führt zu einem Fahrzeug, das etwas anderes tut als angezeigt."
H_VERLAUF_TAGE = "Wie lange die Messpunkte für die kleine Tagesgrafik aufgehoben werden."
H_WARTEZEIT = "So lange wartet die Oberfläche, bis der Dienst einen Befehl beantwortet hat. Danach meldet sie <span class='sm-mono'>OK=2</span> — eingereiht, Ergebnis unbekannt. Es wird bewusst kein Erfolg gemeldet, den niemand geprüft hat."
H_WARTEZEIT_ENDPUNKT = "So lange wartet der <b>Miniserver-Endpunkt</b> auf die Antwort des Dienstes, bevor er <span class='sm-mono'>OK=2</span> meldet. Das ist eine eigene, kürzere Zeit als die der Oberfläche: ein Virtueller Ausgang in Loxone hängt genau so lange. Wer hier 0 einträgt, bekommt sofort <span class='sm-mono'>OK=2</span> — der Befehl wird trotzdem ausgeführt, nur meldet niemand das Ergebnis zurück."
H_ZUGANG_LOESCHEN = "Entfernt E-Mail, Passwort und S-PIN restlos — einschließlich der Sicherungskopie und der gespeicherten Anmeldemarken (<span class='sm-mono'>token.json</span>), denn die sind auch ohne Passwort ein gültiger Zugang zum Konto. Ein leeres Passwortfeld allein löscht nichts; das wäre zu leicht aus Versehen passiert. Was im selben Vorgang eingetippt wurde, wird verworfen."
H_ZUGRIFF_ERZWINGEN = "Manche Fahrzeuge melden die Fähigkeit <span class='sm-mono'>ACCESS</span> nicht, liefern Verriegelung und Türzustand aber sehr wohl. Der Connector bietet dafür einen Schalter an. Nur einschalten, wenn diese Felder sonst leer bleiben — sonst fragt das Plugin etwas ab, das es nicht gibt."
KEINE_FAHRZEUGE = "Noch kein Fahrzeug erkannt. Das ist bis zum ersten erfolgreichen Abruf normal: Zugangsdaten eintragen, speichern, Dienst starten und eine Taktlänge abwarten. Bleibt die Liste danach leer, steht der Grund im Reiter Test und in der Logdatei."
KONTO_ERKLAERUNG = "Es sind die Zugangsdaten des <b>Volkswagen-Kontos</b> — dieselben, mit denen Sie sich in der App <i>Volkswagen</i> beziehungsweise <i>We Connect ID</i> anmelden. Nicht die eines Händlerportals. Sie werden in einer eigenen Datei mit den Rechten 0600 abgelegt, nicht in der Konfiguration, die diese Seite anzeigt. <b>Zwei Hinweise:</b> Der Connector arbeitet mit <b>europäischen</b> Fahrzeugen — für Nordamerika gibt es einen eigenen, hier nicht eingebauten. Und einzelne Konten verlangen eine Zwei-Faktor-Bestätigung; die lässt sich nicht automatisieren. Wer davon betroffen ist, meldet sich einmal im Browser auf diesem Gerät an."
