[EINST]
ABFAHRT_ERKLAERUNG = "Horcht auf ein Thema, das die Restzeit bis zur nächsten Abfahrt in Minuten führt — etwa das des Abfahrts-Assistenten. Fällt sie unter den Vorlauf, wird die Klimatisierung <b>einmal</b> je Abfahrt angefordert. Der Merker wird erst zurückgesetzt, wenn die Restzeit wieder über dem Vorlauf liegt; ohne ihn liefe die Anforderung im Takt weiter, und Volkswagen sperrt ein Konto, das zu oft schreibt."
ANSAGE_ERKLAERUNG = "Das Plugin kann einzelne Ereignisse ansagen – über den Loxone Music Server, MusicServer4Home, eine eigene Adressvorlage, Alexa-NG oder Google-Lautsprecher (Chromecast 4 Lox NG). Ab Werk ist die Ausgabe <b>aus</b>. Angesagt wird nur ein Wechsel, nie ein Wert im Takt; derselbe Anlass wird für dasselbe Fahrzeug höchstens einmal je Stunde angesagt, und nach einem Neustart des Dienstes spricht die erste Abfrage nie. MQTT, Loxone und Benachrichtigungen bleiben davon unberührt. Adresse und Vorlage müssen im Heimnetz liegen."
BREMSE_ERKLAERUNG = "Volkswagen weist zu häufige Anfragen mit HTTP 429 ab, und wer im gleichen Takt weiter anklopft, verlängert die Sperre. Besonders beim Überschussladen ist das eine reale Gefahr: Loxone liefert denselben Ladestrom-Sollwert im Sekundentakt, und daraus entstünden ohne Entprellung dreitausend Schreibbefehle in der Stunde. Ein gedrosselter Befehl wird <b>abgewiesen und gemeldet</b>, nicht stillschweigend verschluckt."
DIENST_ERKLAERUNG = "Der Dienst holt die Werte im eingestellten Takt aus der Volkswagen-Schnittstelle und legt sie ab. Oberfläche und Miniserver lesen nur das Abgelegte — sie sprechen nie selbst mit dem Anbieter."
DIENST_RESTART = "Dienst neu gestartet:"
DIENST_START = "Dienst gestartet:"
DIENST_STOP = "Dienst angehalten:"
EINGREIFEND_ERKLAERUNG = "Ver- und Entriegeln, Hupe und Lichthupe stehen hinter einem <b>zweiten</b> Haken. Sie öffnen das Fahrzeug beziehungsweise machen es auffindbar, und das ist etwas anderes als eine Klimatisierung: wer sich vertippt, hat ein offenes Auto. Der Haken ist ab Werk aus, und die Ausgangsvorlage für Loxone lässt diese Befehle weg, solange er aus ist."
EINGREIFEND_OHNE_SPIN = "Eingreifende Befehle sind zugelassen, aber es ist <b>keine vierstellige S-PIN</b> hinterlegt. Hupe und Lichthupe gehen trotzdem; Ver- und Entriegeln wird abgewiesen, bis die S-PIN eingetragen ist."
EMPFEHLUNG_ERKLAERUNG = "Der Dienst kann auf ein fremdes MQTT-Thema horchen — den Börsenstrompreis, den Überschuss der Photovoltaik — und den Wert gegen eine Grenze halten. Das Ergebnis ist ein eigenes Feld <span class='sm-mono'>EMPFEHLUNG</span> mit 1 oder 0 – 0 auch dann, wenn vom Thema keine Zahl kommt oder der letzte Wert älter ist als dreimal der Abruftakt; einen Strich gibt es nur ohne eingetragenes Thema. <b>Das Plugin entscheidet nichts.</b> Wer daraus eine Ladefreigabe macht, tut das in Loxone — und sieht dort auch, warum geladen wurde. Voraussetzung ist die Bibliothek paho-mqtt in der virtuellen Umgebung; die Installation legt sie an."
FEHLER_ABFAHRT_THEMA = "Die Vorklimatisierung ist eingeschaltet, aber es ist kein Thema eingetragen. Ohne Thema erfährt der Dienst nie, wann abgefahren wird."
