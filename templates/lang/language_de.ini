H_EINGREIFEND = "Eingreifende Befehle"
H_EINGREIFEND_EIN = "Setzt zusätzlich voraus, dass schreibende Befehle überhaupt zugelassen sind. Ver- und Entriegeln verlangt außerdem die vierstellige S-PIN. Der Volkswagen-Connector bietet beide Befehle an (am 06.09.2026 an Fassung 0.10.6 nachgesehen). <b>Ungeprüft</b> ist ihre Wirkung am Fahrzeug: hier stand keines zur Verfügung. Lehnt Volkswagen ab, meldet der Dienst das im Klartext, statt etwas zu behaupten."
