[LOX]
EINLEITUNG = "Neun Schritte. Wer sie von oben nach unten abarbeitet, hat am Ende eine funktionierende Einbindung — einschließlich der kompletten Baustein-Liste in Schritt 8."
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE_FAHRZEUGE = "Mehrere Fahrzeuge im Konto — je Fahrzeug ein eigener virtueller Eingang:"
S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt dann ein passend benannter virtueller Eingang. Der Weg über HTTP verlangt je Wert eine eigene Befehlserkennung, dafür kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anfängt, nimmt MQTT; wer nur wenige Werte braucht, fährt mit HTTP schneller ans Ziel. Beides gleichzeitig geht auch."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Unter <i>System → MQTT Gateway</i> im Abschnitt <i>Subscriptions</i> eintragen:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt — das Plugin sendet, aber niemand hört zu."
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an — das ist weniger mühsam und weniger fehleranfällig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_POSITION = "<b>Standort</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>position</span>. Die Anschrift steht in einer zweiten Zeile und ist für Loxone nicht gedacht; die erste Zeile besteht bewusst nur aus Zahlen."
S4_TEXT = "Drei weitere virtuelle HTTP-Eingänge, jeder nach demselben Muster wie Schritt 3. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer — dort stehen dann überall Striche, und das ist richtig so."
S4_TITEL = "Schritt 4: Weitere Eingänge für Laden, Wartung und Standort"
S4_WARTUNG = "<b>Wartung</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>wartung</span>. Ein Zyklus von 3600 Sekunden genügt; die Werte ändern sich in Tagen."
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v&gt;</span> für den übergebenen Wert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt, dass der Volkswagen-Server den Auftrag mit HTTP 200 entgegengenommen hat. Ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf — wer sicher sein will, wertet den zurückgelesenen Zustand aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen — <b>ein neues Token macht alle diese Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie es also nur neu, wenn es tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgeführt: er sagt, wie alt das Abbild in Sekunden ist. Die Schwelle dafür gehört <b>deutlich über den Abholtakt</b> — bei 300 Sekunden Takt sind 900 Sekunden ein brauchbarer Wert, dann löst ein einzelner verpasster Durchlauf noch keine Meldung aus."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<p><b>Zu #13 bis #16:</b> Die Meldung „Fahrzeug offen oder Licht an“ läuft über ein ODER und eine Einschaltverzögerung. Beides ist Absicht. Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein; hängt man mehrere Quellen direkt an seinen Eingang, verschluckt eine dauerhaft aktive Quelle alle übrigen. Die Verzögerung von fünf Minuten verhindert eine Meldung, während man gerade einlädt.</p><p><b>Zu #17 und #18:</b> Zwei getrennte Schwellwertschalter, weil ein Fahrzeug entweder einen Ladezustand oder einen Tankfüllstand liefert — bei einem Hybrid beides. Der jeweils nicht gelieferte Wert bleibt ein Strich; der zugehörige Schalter behält dann seinen letzten Zustand und schaltet nicht.</p><p><b>Zu #21 und #22:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein — genau deshalb ist er hier richtig: Sie bekommen eine Meldung, wenn das Ladekabel eingesteckt wird, und nicht dauernd, solange es steckt. Wer lieber die umgekehrte Meldung will („Kabel wurde gezogen“), setzt ein NICHT davor.</p><p><b>Zu #23:</b> Die Inspektionsmeldung braucht den Eingang aus dem Wartungs-Abruf (Schritt 4), nicht den aus dem Status-Abruf.</p><p><b>Zu #25:</b> Die Schwelle für die Ausfallerkennung liegt bewusst beim Dreifachen des Abholtakts. Wer sie knapper setzt, bekommt bei jedem einzelnen verpassten Durchlauf eine Meldung.</p><p><b>Zu #28 bis #33:</b> Die Vorheizung ist optional. Die Wochenuhr gibt die gewünschte Abfahrtszeit vor, die UND-Verknüpfung mit der Anwesenheit verhindert das Heizen, während Sie im Urlaub sind, und der Impulsgeber sorgt dafür, dass der Befehl einmal ausgelöst und nicht dauerhaft gesendet wird. <b>Loxone-Zeitrechnung:</b> Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,23 Milliarden), sind 1230768000 abzuziehen.</p><p><b>Zu #34:</b> Optional, aber nützlich: ein Befehl, der die Klimatisierung von Hand wieder ausschaltet. Ohne ihn läuft sie bis zum eigenen Zeitablauf weiter.</p><p><b>Zu #14 — warum dort vier Quellen an zwei Eingängen hängen:</b> Bei UND und ODER ist die Zahl der Eingänge eine Eigenschaft des Bausteins, die Loxone Config selbst setzt. Zieht man einen dritten Eingang auf, öffnet Config die Datei beim nächsten Mal ohne jede Meldung, entfernt den Eingang wieder — und löscht dabei alle Verbindungen, die daran hingen. Erlaubt ist dagegen, an <i>einen</i> Eingang mehrere Quellen zu hängen; sie werden ODER-verknüpft. An einem ODER ist das dasselbe Ergebnis mit zwei Eingängen. <b>An einem UND wäre es falsch</b>: dort werden mehrere Quellen an einem Eingang ebenfalls ODER-verknüpft, und damit wird aus dem UND ein ODER, ohne dass es irgendetwas meldet. Bei #30 hängt deshalb an jedem Eingang genau eine Quelle.</p>"
S8_TEXT = "Jede Zeile ein Baustein. Loxone Config führt alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 12 sind die virtuellen Eingänge aus Schritt 3 und 4 — wer die Vorlage geladen hat, findet sie bereits im Baum."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
