SITZUNG_ERKLAERUNG = "Nach der ersten Anmeldung legt die Bibliothek Anmeldemarken in einer eigenen Datei mit den Rechten 0600 ab und meldet sich damit an, statt jedes Mal das Passwort zu senden. Das schont die Anmeldeseite von Volkswagen, die wiederholte Anmeldungen drosselt. Nach einem Passwortwechsel sind die Marken wertlos — dann hilft der Knopf <i>Anmeldung neu erzwingen</i> oben."
