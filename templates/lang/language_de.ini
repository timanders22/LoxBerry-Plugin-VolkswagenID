VORLAGE_ERKLAERUNG = "Diese Datei legt in Loxone Config die virtuellen Eingänge für alle Zahlenthemen an. Die Werte kommen danach vom Gateway, nicht über die eingetragene Adresse — deshalb steht dort <span class='sm-mono'>localhost</span> und ein Abfragezyklus von einer Woche. Bei MQTT ist der <b>Titel</b> die Adresse: er muss genau dem Thema entsprechen, mit Schrägstrich als Unterstrich, und darf deshalb nicht umbenannt werden."

[LOX]
ART_BEFEHLE = "Befehle"
