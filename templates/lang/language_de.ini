FEHLER_EMAIL_LEER = "Das Feld Benutzername ist leer. Gelöscht wird der Zugang nur über den Haken <i>Zugangsdaten löschen</i>; sonst bitte die E-Mail-Adresse wieder eintragen."
FEHLER_EMPF_PAAR = "Thema und Grenzwert der Ladeempfehlung gehören zusammen. Eines allein bewirkt nichts."
FEHLER_HEIM_PAAR = "Breitengrad und Längengrad gehören zusammen. Entweder beide eintragen oder beide leer lassen — eine halbe Ortsangabe ergibt keine Entfernung."
