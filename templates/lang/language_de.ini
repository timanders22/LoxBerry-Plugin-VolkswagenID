STEUERUNG_ERKLAERUNG = "Ab Werk <b>gesperrt</b>. Schreibende Befehle greifen in ein Fahrzeug ein, das irgendwo steht — ein versehentlich gestarteter Standklimaanlagenlauf entlädt die Batterie, und ein angehaltener Ladevorgang fällt erst am nächsten Morgen auf. Erst freigeben, wenn die Lesewerte im Reiter Test stimmen. <b>Ver- und Entriegeln, Hupe und Lichthupe</b> brauchen zusätzlich den zweiten Haken weiter unten."
