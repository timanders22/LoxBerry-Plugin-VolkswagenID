EINLEITUNG = "Neun Schritte. Wer sie von oben nach unten abarbeitet, hat am Ende eine funktionierende Einbindung &mdash; einschlie&szlig;lich der kompletten Baustein-Liste in Schritt 8."
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE_FAHRZEUGE = "Mehrere Fahrzeuge im Konto — je Fahrzeug ein eigener virtueller Eingang:"
MQTT_COMMENT = "Diese Datei legt nur die Eingänge an; die Werte kommen danach vom MQTT-Gateway, nicht über die eingetragene Adresse. %d Textthema(en) sind bewusst nicht enthalten. Vom LoxBerry-Plugin Volkswagen ID"
S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst; in Loxone gen&uuml;gt dann ein passend benannter virtueller Eingang. Der Weg &uuml;ber HTTP verlangt je Wert eine eigene Befehlserkennung, daf&uuml;r kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anf&auml;ngt, nimmt MQTT; wer nur wenige Werte braucht, f&auml;hrt mit HTTP schneller ans Ziel. Beides gleichzeitig geht auch."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur n&ouml;tig, wenn Sie den MQTT-Weg gehen. Unter <i>System &rarr; MQTT Gateway</i> im Abschnitt <i>Subscriptions</i> eintragen:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an &mdash; das ist weniger m&uuml;hsam und weniger fehleranf&auml;llig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet &mdash; eine 0 w&auml;re eine stille Falschaussage. Loxone beh&auml;lt in diesem Fall den letzten g&uuml;ltigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang &rarr; Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_POSITION = "<b>Standort</b> &mdash; ein eigener Eingang mit der Aktion <span class='sm-mono'>position</span>. Die Anschrift steht in einer zweiten Zeile und ist f&uuml;r Loxone nicht gedacht; die erste Zeile besteht bewusst nur aus Zahlen."
S4_TEXT = "Drei weitere virtuelle HTTP-Eing&auml;nge, jeder nach demselben Muster wie Schritt 3. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer &mdash; dort stehen dann &uuml;berall Striche, und das ist richtig so."
S4_TITEL = "Schritt 4: Weitere Eingänge für Laden, Wartung und Standort"
S4_WARTUNG = "<b>Wartung</b> &mdash; ein eigener Eingang mit der Aktion <span class='sm-mono'>wartung</span>. Ein Zyklus von 3600 Sekunden gen&uuml;gt; die Werte &auml;ndern sich in Tagen."
S5_GESPERRT = "Dieser Befehl ist zurzeit gesperrt: er braucht den zweiten Haken im Reiter Einstellungen."
S5_TEXT = "Nur n&ouml;tig, wenn Loxone etwas ausl&ouml;sen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v&gt;</span> f&uuml;r den &uuml;bergebenen Wert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und m&uuml;ssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> hei&szlig;t, dass der Volkswagen-Server den Auftrag mit HTTP 200 entgegengenommen hat. Ob das Fahrzeug ihn ausf&uuml;hrt, zeigt erst der n&auml;chste Abruf &mdash; wer sicher sein will, wertet den zur&uuml;ckgelesenen Zustand aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Gesch&uuml;tzt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen &mdash; <b>ein neues Token macht alle diese Adressen auf einen Schlag ung&uuml;ltig</b> und muss &uuml;berall nachgetragen werden. W&uuml;rfeln Sie es also nur neu, wenn es tats&auml;chlich in falsche H&auml;nde geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eing&auml;nge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgef&uuml;hrt: er sagt, wie alt das Abbild in Sekunden ist. Die Schwelle daf&uuml;r geh&ouml;rt <b>deutlich &uuml;ber den Abholtakt</b> &mdash; bei 300 Sekunden Takt sind 900 Sekunden ein brauchbarer Wert, dann l&ouml;st ein einzelner verpasster Durchlauf noch keine Meldung aus."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<p><b>Zu #13 bis #16:</b> Die Meldung &bdquo;Fahrzeug offen oder Licht an&ldquo; l&auml;uft &uuml;ber ein ODER und eine Einschaltverz&ouml;gerung. Beides ist Absicht. Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein; h&auml;ngt man mehrere Quellen direkt an seinen Eingang, verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen. Die Verz&ouml;gerung von f&uuml;nf Minuten verhindert eine Meldung, w&auml;hrend man gerade einl&auml;dt.</p><p><b>Zu #17 und #18:</b> Zwei getrennte Schwellwertschalter, weil ein Fahrzeug entweder einen Ladezustand oder einen Tankf&uuml;llstand liefert &mdash; bei einem Hybrid beides. Der jeweils nicht gelieferte Wert bleibt ein Strich; der zugeh&ouml;rige Schalter beh&auml;lt dann seinen letzten Zustand und schaltet nicht.</p><p><b>Zu #21 und #22:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein &mdash; genau deshalb ist er hier richtig: Sie bekommen eine Meldung, wenn das Ladekabel eingesteckt wird, und nicht dauernd, solange es steckt. Wer lieber die umgekehrte Meldung will (&bdquo;Kabel wurde gezogen&ldquo;), setzt ein NICHT davor.</p><p><b>Zu #23:</b> Die Inspektionsmeldung braucht den Eingang aus dem Wartungs-Abruf (Schritt 4), nicht den aus dem Status-Abruf.</p><p><b>Zu #25:</b> Die Schwelle f&uuml;r die Ausfallerkennung liegt bewusst beim Dreifachen des Abholtakts. Wer sie knapper setzt, bekommt bei jedem einzelnen verpassten Durchlauf eine Meldung.</p><p><b>Zu #28 bis #33:</b> Die Vorheizung ist optional. Die Wochenuhr gibt die gew&uuml;nschte Abfahrtszeit vor, die UND-Verkn&uuml;pfung mit der Anwesenheit verhindert das Heizen, w&auml;hrend Sie im Urlaub sind, und der Impulsgeber sorgt daf&uuml;r, dass der Befehl einmal ausgel&ouml;st und nicht dauerhaft gesendet wird. <b>Loxone-Zeitrechnung:</b> Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,23 Milliarden), sind 1230768000 abzuziehen.</p><p><b>Zu #34:</b> Optional, aber n&uuml;tzlich: ein Befehl, der die Klimatisierung von Hand wieder ausschaltet. Ohne ihn l&auml;uft sie bis zum eigenen Zeitablauf weiter.</p><p><b>Zu #14 &mdash; warum dort vier Quellen an zwei Eing&auml;ngen h&auml;ngen:</b> Bei UND und ODER ist die Zahl der Eing&auml;nge eine Eigenschaft des Bausteins, die Loxone Config selbst setzt. Zieht man einen dritten Eingang auf, &ouml;ffnet Config die Datei beim n&auml;chsten Mal ohne jede Meldung, entfernt den Eingang wieder &mdash; und l&ouml;scht dabei alle Verbindungen, die daran hingen. Erlaubt ist dagegen, an <i>einen</i> Eingang mehrere Quellen zu h&auml;ngen; sie werden ODER-verkn&uuml;pft. An einem ODER ist das dasselbe Ergebnis mit zwei Eing&auml;ngen. <b>An einem UND w&auml;re es falsch</b>: dort werden mehrere Quellen an einem Eingang ebenfalls ODER-verkn&uuml;pft, und damit wird aus dem UND ein ODER, ohne dass es irgendetwas meldet. Bei #30 h&auml;ngt deshalb an jedem Eingang genau eine Quelle.</p>"
S8_TEXT = "Jede Zeile ein Baustein. Loxone Config f&uuml;hrt alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 12 sind die virtuellen Eing&auml;nge aus Schritt 3 und 4 &mdash; wer die Vorlage geladen hat, findet sie bereits im Baum."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
S9_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die beiden anderen m&uuml;ssen <b>abgewiesen</b> werden &mdash; wenn nicht, ist etwas an der Absicherung falsch."
S9_TITEL = "Schritt 9: Gegenprobe"
SS_TEXT = "Diese vier Eigenschaften liest das Plugin ohnehin ab. Über den Befehl <span class='sm-mono'>einstellung</span> lassen sie sich auch setzen — als Virtueller Ausgang mit <span class='sm-mono'>&lt;v&gt;</span> für 0 oder 1."
SS_TITEL = "Schritt 6: Ja/Nein-Einstellungen am Fahrzeug setzen"
SS_UNGEMESSEN = "<b>Ungeprüft:</b> ob der Volkswagen-Connector für jede dieser vier Eigenschaften einen Schreibweg anbietet, war ohne Fahrzeug nicht zu messen. Bietet er keinen an, meldet der Dienst das im Klartext — er behauptet keinen Erfolg, den niemand geprüft hat."
SV_FAHRZEUG = "Fahrzeug %d"
SV_OHNE_EINGREIFEND = "Die Ausgangsvorlage enthält <b>keine</b> eingreifenden Befehle (Ver- und Entriegeln, Hupe), weil der zweite Haken im Reiter Einstellungen aus ist. Ein Ausgang auf eine gesperrte Adresse bekäme HTTP 403, und ein Virtueller Ausgang wertet die Antwort nicht aus — der Schalter täte nichts und sagte nichts."
SV_TEXT = "Jede Datei wird in Loxone Config über <b>Datei &rarr; Vorlagen &rarr; Import</b> eingelesen und legt einen fertigen Baustein samt allen Eingängen an. Die Adresse und das Token stehen bereits darin. Wer eine Vorlage zweimal einliest, bekommt sie zweimal — das fällt in der Peripherie nicht auf, in der Programmierung schon."
SV_TITEL = "Alle Vorlagen zum Herunterladen"
