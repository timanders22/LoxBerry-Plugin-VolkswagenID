BILD_ALT = "Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
EINLEITUNG = "Neun Schritte. Wer sie von oben nach unten abarbeitet, hat am Ende eine funktionierende Einbindung — einschließlich der vier Seiten aus dem Musterprojekt in Schritt 8."
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token würfeln"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE_FAHRZEUGE = "Mehrere Fahrzeuge im Konto — je Fahrzeug ein eigener virtueller Eingang:"
MQTT_COMMENT = "Diese Datei legt nur die Eingänge an; die Werte kommen danach vom MQTT-Gateway, nicht über die eingetragene Adresse. %d Textthema(en) sind bewusst nicht enthalten. Vom LoxBerry-Plugin Volkswagen ID"
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1_TEXT = "Es gibt zwei Wege. <b>Das Musterprojekt und die Seiten in Schritt 8 nutzen HTTP</b>: vier Eingangsvorlagen und die Befehlsvorlage legen alle Bausteine an, die Werte kommen je Vorlage in <b>einem</b> Abruf, und man sieht im Browser sofort, was ankommt. MQTT ist der zweite Weg (ab Werk aus): der Gateway erzeugt die Namen der virtuellen Eingänge selbst und liefert auch die Textthemen. Beide Wege gleichzeitig ergeben doppelte Eingänge."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Unter <i>System → MQTT Gateway</i> im Abschnitt <i>Subscriptions</i> eintragen:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an — das ist weniger mühsam und weniger fehleranfällig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_POSITION = "<b>Standort</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>position</span>. Die Anschrift steht in einer zweiten Zeile und ist für Loxone nicht gedacht; die erste Zeile besteht bewusst nur aus Zahlen."
S4_TEXT = "Vier weitere virtuelle HTTP-Eingänge – Laden, Wartung, Verbrauch und Standort –, jeder nach demselben Muster wie Schritt 3; am einfachsten über die Vorlagen darüber. Das Musterprojekt nutzt Laden, Wartung und Verbrauch, nicht den Standort. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer — dort stehen dann überall Striche, und das ist richtig so."
S4_TITEL = "Schritt 4: Weitere Eingänge für Laden, Wartung, Verbrauch und Standort"
S4_WARTUNG = "<b>Wartung</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>wartung</span>. Ein Zyklus von 3600 Sekunden genügt; die Werte ändern sich in Tagen."
S5_GESPERRT = "Dieser Befehl ist zurzeit gesperrt: er braucht den zweiten Haken im Reiter Einstellungen."
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v.1&gt;</span> (eine Nachkommastelle, Temperatur) bzw. <span class='sm-mono'>&lt;v.0&gt;</span> (ganze Zahl) für den übergebenen Wert. Klimatisierung ein und aus sind zwei eigene Befehle: „Klimatisierung ein“ ist analog und nimmt die Temperatur, „Klimatisierung aus“ hält sie an, sobald er eingeschaltet wird."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt, dass der Volkswagen-Server den Auftrag mit HTTP 200 entgegengenommen hat. Ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf — wer sicher sein will, wertet den zurückgelesenen Zustand aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen — <b>ein neues Token macht alle diese Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie es also nur neu, wenn es tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgeführt: er sagt, wie alt das Abbild in Sekunden ist. <span class='sm-mono'>OK</span> geht schon nach dreimal dem Abholtakt auf 0. Steht aber der LoxBerry selbst, frieren auch OK und ALTER ein – das erkennt nur eine Analogwertvalidierung am Laufzähler <span class='sm-mono'>ZAEHLER</span>, der bei jedem Durchgang des Dienstes weiterzählt. Ihre Zeit Tmc gehört über die längste Pause des Dienstes: bei Dauerstörung wartet er bis zu 3600 Sekunden, daher 3900 Sekunden (Seite „VolkswagenID“ in Schritt 8)."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_TEXT = "Vier Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Jede Zeile ein Baustein; Loxone Config führt alle in der Baustein-Suche (Taste F5). Wer nur überwachen will, übernimmt die erste Seite allein; „Laden“, „Klima und Befehle“ und „Fahrzeug“ bauen darauf auf. Die Namen gelten für Fahrzeug 1 so, wie die Vorlagen sie anlegen; die Titel der Vorlagen sind fest deutsch, auch bei englischer Oberfläche."
S8_TITEL = "Schritt 8: Vier Seiten aus dem Musterprojekt zum Nachbauen"
S9_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die beiden anderen müssen <b>abgewiesen</b> werden — wenn nicht, ist etwas an der Absicherung falsch."
S9_TITEL = "Schritt 9: Gegenprobe"
SS_TEXT = "Diese drei Eigenschaften liest das Plugin ohnehin ab. Über den Befehl <span class='sm-mono'>einstellung</span> lassen sie sich auch setzen — als Virtueller Ausgang mit <span class='sm-mono'>&lt;v.0&gt;</span> für 0 oder 1."
SS_TITEL = "Schritt 6: Ja/Nein-Einstellungen am Fahrzeug setzen"
SS_UNGEMESSEN = "Der Volkswagen-Connector bietet für alle drei Eigenschaften einen Schreibweg an (am 06.09.2026 an Fassung 0.10.6 nachgesehen). <b>Ungeprüft</b> ist die Wirkung am Fahrzeug. Lehnt Volkswagen ab, meldet der Dienst das im Klartext — er behauptet keinen Erfolg, den niemand geprüft hat."
SV_FAHRZEUG = "Fahrzeug %d"
SV_OHNE_EINGREIFEND = "Die Ausgangsvorlage enthält <b>keine</b> eingreifenden Befehle (Ver- und Entriegeln, Hupe), weil der zweite Haken im Reiter Einstellungen aus ist. Ein Ausgang auf eine gesperrte Adresse bekäme HTTP 403, und ein Virtueller Ausgang wertet die Antwort nicht aus — der Schalter täte nichts und sagte nichts."
SV_TEXT = "Jede Datei wird in Loxone Config eingelesen – Eingangsvorlagen: <b>im Baum „Virtuelle Eingänge“ wählen, Menüband „Vordefinierte HTTP-Geräte → Vorlage importieren…“</b>; Befehlsvorlage: <b>Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“</b> – und legt einen fertigen Baustein samt allen Eingängen an. Die Adresse und das Token stehen bereits darin. Wer eine Vorlage zweimal einliest, bekommt sie zweimal — das fällt in der Peripherie nicht auf, in der Programmierung schon."
SV_TITEL = "Alle Vorlagen zum Herunterladen"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. Alle bisher im Miniserver eingetragenen Adressen sind damit ungültig und müssen nachgetragen werden."
