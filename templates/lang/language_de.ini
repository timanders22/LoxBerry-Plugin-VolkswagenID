H_TEMP = "Grenzen f&uuml;r die Klimatisierung. Ein Wert au&szlig;erhalb wird <b>abgewiesen</b>, nicht auf die Grenze gekappt: ein still ver&auml;nderter Sollwert f&uuml;hrt zu einem Fahrzeug, das etwas anderes tut als angezeigt."
H_VERLAUF_TAGE = "Wie lange die Messpunkte f&uuml;r die kleine Tagesgrafik aufgehoben werden."
H_WARTEZEIT = "So lange wartet die Oberfl&auml;che, bis der Dienst einen Befehl beantwortet hat. Danach meldet sie <span class='sm-mono'>OK=2</span> &mdash; eingereiht, Ergebnis unbekannt. Es wird bewusst kein Erfolg gemeldet, den niemand gepr&uuml;ft hat."
H_WARTEZEIT_ENDPUNKT = "So lange wartet der <b>Miniserver-Endpunkt</b> auf die Antwort des Dienstes, bevor er <span class='sm-mono'>OK=2</span> meldet. Das ist eine eigene, kürzere Zeit als die der Oberfläche: ein Virtueller Ausgang in Loxone hängt genau so lange. Wer hier 0 einträgt, bekommt sofort <span class='sm-mono'>OK=2</span> — der Befehl wird trotzdem ausgeführt, nur meldet niemand das Ergebnis zurück."
H_ZUGANG_LOESCHEN = "Entfernt E-Mail, Passwort und S-PIN restlos — einschließlich der Sicherungskopie und der gespeicherten Anmeldemarken (<span class='sm-mono'>token.json</span>), denn die sind auch ohne Passwort ein gültiger Zugang zum Konto. Ein leeres Passwortfeld allein löscht nichts; das wäre zu leicht aus Versehen passiert. Was im selben Vorgang eingetippt wurde, wird verworfen."
H_ZUGRIFF_ERZWINGEN = "Manche Fahrzeuge melden die F&auml;higkeit <span class='sm-mono'>ACCESS</span> nicht, liefern Verriegelung und T&uuml;rzustand aber sehr wohl. Der Connector bietet daf&uuml;r einen Schalter an. Nur einschalten, wenn diese Felder sonst leer bleiben &mdash; sonst fragt das Plugin etwas ab, das es nicht gibt."
