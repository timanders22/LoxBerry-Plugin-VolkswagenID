H_ZUGANG_LOESCHEN = "Entfernt E-Mail, Passwort und S-PIN restlos &mdash; einschlie&szlig;lich der Sicherungskopie und der gespeicherten Anmeldemarken (<span class="sm-mono">token.json</span>), denn die sind auch ohne Passwort ein g&uuml;ltiger Zugang zum Konto. Ein leeres Passwortfeld allein l&ouml;scht nichts; das w&auml;re zu leicht aus Versehen passiert. Was im selben Vorgang eingetippt wurde, wird verworfen."
