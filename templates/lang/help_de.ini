; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Volkswagen ID"
K02 = "Bindet Volkswagen-Fahrzeuge über das Volkswagen-Konto an Loxone an: Ladezustand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster, Licht, Handbremse, Fahrzeugzustand, Klimatisierung, Scheibenheizung, Ladewerte, Standort sowie Inspektions- und Ölservice-Fristen. Auf Wunsch lassen sich Klimatisierung, Ladevorgang, Ladegrenze, Ladestrom und Scheibenheizung schalten."
K03 = "Gebaut ist es für die <b>ID-Reihe</b> (ID.3, ID.4, ID.5, ID.7, ID.Buzz). Es funktioniert auch mit anderen vernetzten Volkswagen — dann bleiben die rein elektrischen Werte leer und die Werte des Verbrenners sind belegt. Bei einem Plug-in-Hybrid führt das Plugin beide."
K04 = "Zwei Grenzen, die man vorher kennen sollte"
K05 = "<b>Europa.</b> Der verwendete Connector spricht mit dem europäischen Dienst. Für nordamerikanische Fahrzeuge gibt es einen eigenen Connector, der hier <b>nicht</b> eingebaut ist."
K06 = "<b>Zwei-Faktor-Bestätigung.</b> Einzelne Konten verlangen sie beim Anmelden. Das lässt sich nicht automatisieren; wer davon betroffen ist, meldet sich einmal im Browser auf demselben Gerät an."
K07 = "Abholtakt: mindestens 180 Sekunden"
K08 = "Das ist keine Vorsicht dieses Plugins, sondern die Untergrenze der Bibliothek — darunter nimmt sie die Einstellung gar nicht erst an. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg, nicht ein kürzerer Takt."
K09 = "Zugangsdaten"
K10 = "Es sind die Zugangsdaten des <b>Volkswagen-Kontos</b> — dieselben wie in der App <i>Volkswagen</i> beziehungsweise <i>We Connect ID</i>. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei. Das Passwort wird nirgends angezeigt; im Reiter <i>Test</i> steht nur seine Länge."
K11 = "Nach der ersten Anmeldung legt die Bibliothek Anmeldemarken ab und meldet sich damit an, statt jedes Mal das Passwort zu senden. Nach einem Passwortwechsel sind sie wertlos — dafür gibt es im Reiter <i>Einstellungen</i> den Knopf <i>Anmeldung neu erzwingen</i>."
K12 = "So gehen Sie vor"
K13 = "<b>Einstellungen:</b> Benutzername und Passwort eintragen, speichern, dann <i>Dienst starten</i>."
K14 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K15 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K16 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K17 = "Wenn Türen und Verriegelung leer bleiben"
K18 = "Manche Fahrzeuge melden die Fähigkeit <i>ACCESS</i> nicht, liefern die Werte aber trotzdem. Dafür gibt es im Reiter <i>Einstellungen</i> den Haken <i>Türzustand erzwingen</i>. Nur einschalten, wenn diese Felder sonst leer bleiben."
K19 = "Steuerung"
K20 = "Schreibende Befehle sind ab Werk <b>gesperrt</b> und müssen ausdrücklich freigegeben werden. Ver- und Entriegeln sowie Hupe und Lichthupe bietet dieses Plugin bewusst <b>nicht</b> an. Wichtig: eine Antwort mit <i>OK=1</i> heißt, dass der Volkswagen-Server den Auftrag entgegengenommen hat — ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf."
K21 = "Was ungeprüft ist"
K22 = "Dieses Plugin wurde ohne Volkswagen-Konto und ohne Fahrzeug gebaut. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob ein bestimmtes Fahrzeug alle abgefragten Werte liefert und ob die schreibenden Befehle die erwartete Wirkung haben. Die Zuordnung der Werte selbst ist dagegen gegen echte Objekte der Bibliothek gemessen. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K23 = "Grundlage"
K24 = "Die Anbindung nutzt die Bibliotheken <i>carconnectivity</i> und <i>carconnectivity-connector-volkswagen</i> von tillsteinbach (MIT). Sie sind keine amtliche Volkswagen-Schnittstelle und können sich jederzeit ändern."
