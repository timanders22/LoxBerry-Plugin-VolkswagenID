G41_ERKLAERUNG = "These settings have a form of their own. Everything is off by default. Pre-climatisation itself (checkbox, lead time, target temperature) is in the departure section above."
GESPEICHERT = "The settings were saved."
GRUND_FORM = "not a single value or contains control characters"
GRUND_GANZ = "not a whole number from %s to %s"
GRUND_LAENGE = "longer than %s characters"
GRUND_MUSTER = "does not match the permitted pattern"
