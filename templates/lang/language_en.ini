[EINST]
ABFAHRT_ERKLAERUNG = "Listens to a topic carrying the remaining time until the next departure in minutes — the departure assistant's topic, for instance. Once it drops below the lead time, climate control is requested <b>once</b> per departure. The marker is only cleared when the remaining time rises above the lead time again; without it the request would repeat every cycle, and Volkswagen blocks an account that writes too often."
BREMSE_ERKLAERUNG = "Volkswagen rejects excessive requests with HTTP 429, and knocking at the same rate afterwards extends the block. Surplus charging makes this a real risk: Loxone delivers the same charging current setpoint every second, and without debouncing that would become three thousand write commands per hour. A throttled command is <b>rejected and reported</b>, not silently swallowed."
DIENST_ERKLAERUNG = "The service fetches values from the Volkswagen cloud at the configured interval and stores them. The user interface and the Miniserver only read what has been stored &mdash; they never talk to the provider themselves."
DIENST_RESTART = "Service restarted:"
DIENST_START = "Service started:"
DIENST_STOP = "Service stopped:"
EINGREIFEND_ERKLAERUNG = "Locking and unlocking, horn and light flash sit behind a <b>second</b> checkbox. They open the car or make it conspicuous, and that is a different matter from climate control: a typing slip leaves you with an open car. The checkbox is off by default, and the output template for Loxone omits these commands as long as it is off."
EINGREIFEND_OHNE_SPIN = "Intrusive commands are permitted, but <b>no four-digit S-PIN</b> is stored. Horn and light flash still work; locking and unlocking is rejected until the S-PIN is entered."
EMPFEHLUNG_ERKLAERUNG = "The service can listen to a foreign MQTT topic — the spot electricity price, the photovoltaic surplus — and compare the value against a threshold. The result is a separate field <span class='sm-mono'>EMPFEHLUNG</span> holding 1, 0 or a dash. <b>The plugin decides nothing.</b> Turning that into a charging release is done in Loxone — where you can also see why charging started. This requires the paho-mqtt library in the virtual environment; the installation provides it."
FEHLER_ABFAHRT_THEMA = "Pre-conditioning is enabled, but no topic is entered. Without a topic the service never learns when departure is due."
FEHLER_BEREICH = "%s: the value must be between %d and %d."
FEHLER_EMAIL = "The username does not look like an e-mail address."
FEHLER_EMPF_PAAR = "Topic and threshold of the charging recommendation belong together. Either one alone has no effect."
FEHLER_HEIM_PAAR = "Latitude and longitude belong together. Enter both or leave both empty — half a location yields no distance."
FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_SPIN = "The S-PIN consists of exactly four digits. The value entered does not match that pattern and was not saved."
FEHLER_TEMP_TAUSCH = "The lowest target temperature is higher than the highest. Please swap the two values."
FEHLER_THEMA = "%s: allowed are letters, digits, hyphen, underscore and slash."
FEHLER_TOPIC = "The topic prefix contains characters that are not allowed. Use letters, digits, hyphen, underscore and slash."
FEHLER_ZAHL = "%s: please enter a whole number."
FEHLER_ZUGANG_LOESCHEN = "The credentials could not be deleted. Please check the file permissions."
FEHLER_ZUGANG_SPEICHERN = "The credentials file could not be written. Check the permissions of the configuration folder."
GESPEICHERT = "The settings were saved."
HEIMAT_ERKLAERUNG = "If latitude and longitude of the home location are stored, the service calculates the distance of the car in metres and derives a <span class='sm-mono'>ZUHAUSE</span> of 0 or 1 from it. That saves the arithmetic in the Miniserver and turns a position into a digital input. Without a home location both values stay empty — not 0: a 0 would mean <i>not at home</i>, and nobody knows that."
H_ABFAHRT = "Pre-conditioning before departure"
H_ABFAHRT_TEMP = "Must lie within the limits set above, otherwise the service rejects the request. It always applies to vehicle 1."
H_ABFAHRT_THEMA = "The value must be a number of minutes. A negative value is ignored — it would mean the departure is in the past."
H_ABSTAND_ABRUF = "Applies only to the <span class='sm-mono'>abruf</span> command. 0 disables the limit."
H_BEFEHLE_STUNDE = "Counted over a sliding hour, not per clock hour. The immediate poll does not count towards it — it has its own limit."
H_BREMSE = "Rate limiting"
H_DIENST = "Polling service"
H_EINGREIFEND = "Intrusive commands"
H_EINGREIFEND_EIN = "Additionally requires that write commands are permitted at all. Locking and unlocking also requires the four-digit S-PIN. <b>Unverified:</b> no car was available here; whether the Volkswagen connector offers these two commands could not be measured. If it does not, the service says so in plain words instead of claiming anything."
H_EMAIL = "The e-mail address the Volkswagen account was created with."
H_EMPFEHLUNG = "Charging recommendation"
H_EMPF_KLEINER = "Ticked for a price (cheap is good), unticked for a surplus (plenty is good). Topic and threshold belong together; either one alone has no effect and is rejected."
H_EMPF_THEMA = "Full topic name, no wildcards. Leaving it empty disables the feature. The topics of this house's spot-price plugins can be used directly."
H_ENTPRELLUNG = "The same command carrying the same value is not sent again within this time. A <i>different</i> value goes through at once — so the limiter never delays a real change. 0 disables it."
H_ERKANNT = "Detected vehicles"
H_HEIMAT = "Home location"
H_HEIM_KOORDINATEN = "Decimal degrees with a dot, for example <span class='sm-mono'>48.137200</span> and <span class='sm-mono'>11.575600</span>. The two fields belong together: only one of them yields no distance and is rejected. Leaving both empty disables the feature."
H_HEIM_RADIUS = "Locating a car is accurate to a few metres, considerably worse under trees or in a garage. 150 metres is a usable starting point; too small a radius makes the car flicker in its own driveway."
H_INTERVALL = "Time between two polls. Allowed: 180 to 3600 seconds &mdash; 180 is the library's lower limit, not a precaution added by this plugin."
H_KONTO = "Volkswagen account access"
H_MQTT_RETAIN = "When ticked, the broker remembers every value. After a restart of the Miniserver or the gateway the virtual inputs immediately hold the last known state; without this they stay empty until the next poll completes — with a five-minute cycle that means several minutes. The heartbeat still tells you whether the value is fresh. <b>Not measured on the device:</b> that the gateway's UDP input accepts the keyword <span class='sm-mono'>retain</span> is documented by three sibling plugins; no LoxBerry was available here."
H_MQTT_TOPIC = "Letters, digits, hyphen, underscore and slash are allowed. All topics derive from this prefix, see the MQTT tab."
H_PASSWORT = "Leaving the field empty keeps the stored password. It is never displayed &mdash; the Test tab only shows its length."
H_SICHERUNG = "Back up and restore settings"
H_SPIN = "The four-digit S-PIN from the Volkswagen app. This plugin offers <b>no</b> locking, unlocking or horn and therefore does not need it; the field is prepared for a later version. Leave it empty if you do not need it."
H_STEUERUNG = "Write commands"
H_TAKT = "Polling interval"
H_TAKT_WARTUNG = "Inspection and oil service change in days, not minutes. With a 300 second interval, 12 means once per hour."
H_TEMP = "Limits for the air conditioning. A value outside them is <b>rejected</b>, not clamped: a silently altered setpoint leads to a car doing something other than what is displayed."
H_VERLAUF_TAGE = "How long the readings for the small daily chart are kept."
H_WARTEZEIT = "How long the interface waits for the service to answer a command. After that it reports <span class='sm-mono'>OK=2</span> &mdash; queued, outcome unknown. No success is reported that nobody has verified."
H_WARTEZEIT_ENDPUNKT = "How long the <b>Miniserver endpoint</b> waits for the service to answer before it reports <span class='sm-mono'>OK=2</span>. This is a separate, shorter time than the one used by this page: a Virtual Output in Loxone hangs for exactly this long. Entering 0 gives you <span class='sm-mono'>OK=2</span> immediately — the command still runs, but nobody reports the outcome back."
H_ZUGANG_LOESCHEN = "Removes e-mail, password and S-PIN completely — including the backup copy and the stored login tokens (<span class='sm-mono'>token.json</span>), which grant access to the account even without the password. An empty password field on its own deletes nothing; that would happen by accident far too easily. Anything typed in the same step is discarded."
H_ZUGRIFF_ERZWINGEN = "Some cars do not announce the <span class='sm-mono'>ACCESS</span> capability although they do report locking and door status. The connector offers a switch for this. Only enable it if those fields stay empty otherwise &mdash; else the plugin asks for something that does not exist."
KEINE_FAHRZEUGE = "No vehicle detected yet. That is normal until the first successful poll: enter the credentials, save, start the service and wait one interval. If the list is still empty afterwards, the reason is in the Test tab and in the log file."
KONTO_ERKLAERUNG = "These are the credentials of your <b>Volkswagen account</b> &mdash; the same ones you use in the <i>Volkswagen</i> or <i>We Connect ID</i> app. Not those of a dealer portal. They are stored in a separate file with mode 0600, not in the configuration this page displays. <b>Two notes:</b> the connector works with <b>European</b> vehicles &mdash; there is a separate one for North America which is not included here. And some accounts ask for two-factor confirmation, which cannot be automated; if that affects you, sign in once in a browser on this machine."
