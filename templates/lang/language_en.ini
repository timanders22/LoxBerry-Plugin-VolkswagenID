SITZUNG_VERWORFEN = "The authentication tokens were deleted. On the next poll the service will sign in again with username and password."
SPIN_GESETZT = "stored – leave empty to keep it"
SPIN_LEER = "no S-PIN stored"
STEUERUNG_ERKLAERUNG = "<b>Disabled by default.</b> Write commands act on a car parked somewhere else — an air conditioning run started by accident drains the battery, and a stopped charge is only noticed the next morning. Enable this only once the read values in the Test tab look right. <b>Locking, unlocking, horn and light flash</b> additionally require the second checkbox further down."
TAKT_WARNUNG = "<b>Lower limit 180 seconds.</b> The Volkswagen connector refuses anything below that — it raises an error on creation. And above it the same applies: Volkswagen rejects frequent requests with HTTP 429, and a car that is woken constantly draws standby current. Five minutes is a good start. If you need a value right now, use the poll command, not a shorter interval."
T_ANTRIEB = "Drivetrain"
T_BATTERIE = "Battery"
T_KENNZEICHEN = "Licence plate"
T_MODELL = "Model"
T_NR = "No."
T_SOFTWARE = "Software version"
T_VIN = "VIN"
VIN_HINWEIS = "Every address also accepts the VIN instead of the number — <span class='sm-mono'>fahrzeug=WVW…</span>. That is more robust if a second vehicle is added to the account later and the order shifts."
VORGABE_LEER = "(empty)"
VORGABE_TTS = "speech output off"
WARN_PW_OHNE_KONTO = "A password is stored but no username. Every login will fail without showing why."
WAS_IST_DAS = "<b>Volkswagen vehicles in Loxone.</b> A service on the LoxBerry signs in with the Volkswagen account and fetches, at the set interval, state of charge, range, locks, doors and windows, climate control, position and service deadlines of the vehicles (library carconnectivity). The values reach the Miniserver over MQTT. On request the plugin switches climate control, charging and window heating – locking, horn and flashing only behind a second tick box."
WERT_UNGUELTIG = "Stored value for %s is invalid (%s); the default %s applies. Please save again."
ZUGANG_GELOESCHT = "E-mail, password, S-PIN and the login tokens have been deleted. The service can no longer sign in until new credentials are entered."

[MQTT]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_SCHRITTE = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> without this entry nothing arrives at the Miniserver. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_V2_SCHRITTE = "Your gateway runs version 2. The topic group appears there on its own under <b>Subscriptions</b> as soon as the plugin has sent for the first time; there is nothing to enter. What you will see is this group:"
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
ABRAEUMEN_VORGEMERKT = "Retained values of this plugin were kept under <span class='sm-mono'>%s</span>. The service clears them at the broker on its next run and reads back; until then the prefix stays queued – also for uninstalling."
AUTOSTART_AUS = "The gateway is <b>not</b> set to autostart. The broker entry alone is not enough — it is set out of the box and says nothing about whether messages can arrive. What matters is autostart under <i>System → MQTT Gateway</i>."
AUTOSTART_EIN = "The gateway is set to autostart, so messages from this plugin can arrive."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <i>System → MQTT Gateway</i>."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "All published topics"
H_V2 = "Gateway V2: tick these data points"
H_VORLAGE = "Template for the MQTT path"
H_ZUSTAND = "State of the MQTT gateway"
K_VORLAGE = "MQTT template for vehicle %d"
NICHT_GEFUNDEN = "No MQTT section was found in the LoxBerry <span class='sm-mono'>general.json</span>. Nothing can be sent without it."
PLATZHALTER = "<b>N</b> is the vehicle number, so 1 for the first one."
RETAIN_ERKLAERUNG = "The <b>Retained</b> column says whether the broker keeps the value. States of the vehicle are kept — after a Miniserver restart the last valid reading is there again at once. Measurements with a time reference, daily values, the charging recommendation, the heartbeat and everything the <b>service says about itself</b> (<span class='sm-mono'>ok</span>, <span class='sm-mono'>fehler_folge</span>, <span class='sm-mono'>fehlertext</span>, <span class='sm-mono'>ausfalltext</span>) are <b>not</b> kept: a retained &quot;all fine&quot; would stay up after the service died, and a retained error text would stay forever even once everything works again. Since version 0.9.24 the plugin clears such leftovers from earlier versions out of the broker once. If a successful poll gives no statement for a state, <span class='sm-mono'>-</span> is sent; a vehicle the account no longer holds gets <span class='sm-mono'>-</span> once on all its retained topics."
TEXT_ERKLAERUNG = "Topics carrying text get <b>no</b> virtual input in the Loxone template — a virtual input is a number. Over MQTT they are useful nonetheless: the state text says <span class='sm-mono'>conservation</span> where the number only says 0."
THEMEN_ERKLAERUNG = "A topic this vehicle does not answer is not sent at all — so no topic is created carrying an invented zero. Exception since addendum 4: a measured value (not retained) without a statement goes out as -1, temperatures as -999, so that no old value looks measured in Loxone. States without a statement stay -."
THEMEN_ZAHL = "%d topics in total: %d carrying a number, %d carrying text."
T_AUTOSTART = "Gateway autostart"
T_BEDEUTUNG = "Meaning"
T_BEHALTEN = "yes"
T_BEHALTEN_AUS = "no (tick box 'keep values in the broker' is off)"
T_BROKER = "Broker"
T_FLUECHTIG = "no"
T_GATEWAYNAME = "Name in Loxone"
T_NONCACHED = "Noncached"
T_PLUGIN = "Publishing by this plugin"
T_RETAIN = "Retained"
T_TEXTWERT = "text"
T_THEMA = "Topic"
T_UDP = "UDP input port"
V2_ERKLAERUNG = "With <b>MQTT gateway V2</b> only what is ticked in the gateway's <i>Subscriptions</i> reaches the Miniserver. This table is the list for it – topic, name of the virtual input in Loxone and whether <i>Noncached</i> must be set (for the heartbeat and “ok”, otherwise V2 does not resend an unchanged value after a Miniserver restart). Texts (model, licence plate, address, plain texts) and timestamps are left out on purpose. The line in the <i>Test</i> tab checks whether everything is ticked."
VORLAGE_ERKLAERUNG = "This file creates the virtual inputs for all numeric topics in Loxone Config. The values then arrive from the gateway, not over the address entered — which is why it says <span class='sm-mono'>localhost</span> with a polling cycle of one week. With MQTT the <b>title</b> is the address: it must match the topic exactly, with the slash replaced by an underscore, and must therefore not be renamed."

[LOX]
ART_BEFEHLE = "Commands"
ART_LADEN = "Charging"
ART_POSITION = "Position"
ART_STATUS = "Status"
ART_VERBRAUCH = "Consumption"
ART_WARTUNG = "Maintenance"
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
EINLEITUNG = "Nine steps. Work through them from top to bottom and you end up with a working integration — including the four pages from the sample project in step 8."
G41_ENDPUNKT_AUS = "This path is switched off – the tick is in the <i>MQTT</i> tab under “Commands from Loxone via MQTT”."
G41_NEUER_WEG = "<b>New since 0.9.33:</b> new installations use <b>MQTT gateway V2</b> (tick the data points, table in the <i>MQTT</i> tab) and the <b>command bridge</b> (template commands via MQTT). The HTTP path below remains for existing installations."
H_TITEL = "Loxone integration"
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE = "Download template for Loxone Config"
MEHRERE_FAHRZEUGE = "Several vehicles in the account — one virtual input per vehicle:"
MQTT_COMMENT = "This file only creates the inputs; the values then arrive from the MQTT gateway, not over the address entered. %d text topic(s) are deliberately not included. From the LoxBerry plugin Volkswagen ID"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "There are two paths. <b>The sample project and the pages in step 8 use HTTP</b>: four input templates and the command template create all blocks, the values arrive in <b>one</b> request per template, and you can see in the browser right away what arrives. MQTT is the second path (off by default): the gateway creates the names of the virtual inputs itself and also delivers the text topics. Both paths at once give duplicate inputs."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed for the MQTT path. Under <i>System → MQTT Gateway</i>, section <i>Subscriptions</i>, add:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once — less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose — a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_POSITION = "<b>Location</b> — a separate input using the action <span class='sm-mono'>position</span>. The postal address is on a second line and is not meant for Loxone; the first line deliberately contains numbers only."
S4_TEXT = "Four more virtual HTTP inputs – charging, servicing, consumption and location –, each built like step 3; easiest via the templates above. The sample project uses charging, servicing and consumption, not the location. The charging input stays empty on a pure combustion car — you will see dashes there, and that is correct."
S4_TITEL = "Step 4: further inputs for charging, servicing, consumption and location"
S4_WARTUNG = "<b>Servicing</b> — a separate input using the action <span class='sm-mono'>wartung</span>. A cycle of 3600 seconds is plenty; these values change in days."
S5_GESPERRT = "This command is currently blocked: it needs the second checkbox in the Settings tab."
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v.1&gt;</span> (one decimal, temperature) or <span class='sm-mono'>&lt;v.0&gt;</span> (whole number) stands for the value passed. Climate control on and off are two commands of their own: “climate control on” is analogue and takes the temperature, “climate control off” stops it as soon as it is switched on."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Two things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> an answer of <span class='sm-mono'>OK=1</span> means the Volkswagen server accepted the request with HTTP 200. Whether the car carries it out only shows on the next poll — if you need certainty, evaluate the state read back, not the answer to the command."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver — <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it states the age of the snapshot in seconds. <span class='sm-mono'>OK</span> already drops to 0 after three times the polling interval. If the LoxBerry itself stands still, however, OK and ALTER freeze as well – only a Value Validator on the run counter <span class='sm-mono'>ZAEHLER</span>, which counts up with every pass of the service, notices that. Its time Tmc belongs above the longest pause of the service: during a persistent fault it waits up to 3600 seconds, hence 3900 seconds (page “VolkswagenID” in step 8)."
S7_TITEL = "Step 7: failure detection"
S8_TEXT = "Four pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. One block per row; Loxone Config lists them all in the block search (key F5). If you only want monitoring, take over the first page alone; “Laden”, “Klima und Befehle” and “Fahrzeug” build on it. The names apply to vehicle 1 as the templates create them; the template titles are fixed German, also with an English interface."
S8_TITEL = "Step 8: four pages from the sample project to rebuild"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> — if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
SS_TEXT = "The plugin reads these three properties anyway. The <span class='sm-mono'>einstellung</span> command also sets them — as a Virtual Output with <span class='sm-mono'>&lt;v.0&gt;</span> for 0 or 1."
SS_TITEL = "Step 6: setting yes/no properties on the car"
SS_UNGEMESSEN = "The Volkswagen connector offers a write path for all three properties (checked against version 0.10.6 on 06.09.2026). The effect on the car is <b>unverified</b>. If Volkswagen rejects it, the service says so in plain words — it claims no success that nobody has checked."
SV_FAHRZEUG = "Vehicle %d"
SV_OHNE_EINGREIFEND = "The output template contains <b>no</b> intrusive commands (lock/unlock, horn) because the second checkbox in the Settings tab is off. An output pointing at a blocked address would receive HTTP 403, and a Virtual Output does not evaluate the answer — the switch would do nothing and say nothing."
SV_TEXT = "Each file is read into Loxone Config – input templates: <b>select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”</b>; command template: <b>tree “Virtual Outputs” → “Predefined devices → Import template…”</b> – and creates a finished block with all its inputs. Address and token are already in it. Importing a template twice gives you two of them — unnoticeable in the periphery, but not in the program."
SV_TITEL = "All templates for download"
TOKEN_NEU = "A new token was created. All addresses entered in the Miniserver so far are invalid now and have to be updated."
