SITZUNG_ERKLAERUNG = "After the first login the library stores authentication tokens in a separate file with mode 0600 and uses them instead of sending the password every time. This spares the Volkswagen login page, which throttles repeated sign-ins. After a password change the tokens are worthless — then use the <i>Force a new login</i> button above."
