[BAUSTEIN]
HINWEISE_TITEL = "Notes"
S1_H1 = "The fault message comes after 10 minutes without fresh data. A LoxBerry that stands still only shows after a good hour (no. 15, Tmc 3900 s): during a long cloud outage the service itself waits up to an hour, and the run counter stands still for that long too."
S1_H2 = "On no. 15: if the LoxBerry stands still, all inputs keep their last value, VW_1_OK included; only the frozen run counter VW_1_ZAEHLER gives it away."
S1_H3 = "On no. 22, 24 and 27: a Threshold Switch behind a polled input gives a short pulse at every poll; the Switch-On Delay in front of the message swallows it. Never connect a Threshold Switch directly to a notification."
S1_H4 = "Combustion car: connect formula no. 21 to VW_1_TANK instead of VW_1_SOC and adapt the text of no. 28. A value 0 (never delivered, before the first poll) does not count as low."
S1_H5 = "“Meldung Ladung beendet” comes at every end of charging – also when the cable is unplugged and at every pause of “Laden nach Empfehlung” (page “VolkswagenID Laden”). If you do not want that, put an AND with a negated “Empfehlung hält an (VW)” in front."
S1_H6 = "Second vehicle: in the tab “%s” fetch the templates for vehicle 2 (names VW_2_…, containers “Volkswagen 2 …”) and copy the pages with these names; lead the fault of the second car through another OR in front of no. 18."
S1_H7 = "After “%s” in the plugin renew the address on all five containers (or fetch the templates again – but then redraw all connections)."
S1_SCHRITT1 = "In the plugin tab “%s” enter the login of the Volkswagen account, save and press “%s”. For the statement “at home” enter the home location in the section “%s”. Tab “%s” → “%s”: a line VOLKSWAGEN;OK=1;SOC=… comes back"
S1_SCHRITT2 = "Tab “%s” → “%s” → for vehicle 1 download the templates “%s”, “%s”, “%s” and “%s” as well as “%s”. In Loxone Config the four input templates: select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”; the commands: tree “Virtual Outputs” → “Predefined devices → Import template…”. Import each only ONCE (twice gives duplicate blocks). The position template is not needed."
S1_SCHRITT3 = "Create the page “VolkswagenID”. Drag the commands no. 1–10 from the container “Volkswagen 1 Status”, no. 11–13 from “Volkswagen 1 Laden”, plus the constant 1 (no. 14, block search F5, value 1)."
S1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification): “Meldung Auto gestört (VW)”, “Meldung Ladestand niedrig (VW)” and “Meldung Ladung beendet (VW)”, texts as in the list. Each gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom. On the Value Validator no. 15 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). AND no. 26: negate input I2 – click its input point in Config; it then shows a small circle. Status “Zustand (VW)”: click “+” twice first, “Ladestand und Reichweite (VW)” four times; enter the rows in the given order, the one without condition last. Edge Detection no. 31: connect the notification to output Off. Switch on “Statistics” in the properties window of VW_1_SOC and VW_1_REICHW."
S1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (VW)” shows “läuft – Werte … s alt”, and VW_1_ZAEHLER counts up with every poll."
S2_H1 = "“Laden nach Empfehlung” needs, in the plugin section “%s”, an MQTT topic (for example the grid power) and a limit, plus the home location – otherwise AND no. 31 stays off. The plugin only calculates the recommendation; Loxone starts and stops."
S2_H2 = "With EVCC at the wallbox leave both switches off – EVCC controls there (pages “EVCC …”); two controllers on the same car work against each other."
S2_H3 = "Switching “Laden von Hand (VW)” off sends “stop charging” as long as no recommendation is charging (OR no. 35). If you only charge by recommendation, leave it off."
S2_H4 = "Release the sliders in the app instead of dragging them: every new value is a command, and the plugin lets through at most 30 per hour."
S2_H5 = "Charging current: the sample only knows 6 and 16 A. Try models with ampere steps (5, 10, 13, 32) in the plugin tab “%s” and adapt the slider."
S2_H6 = "The energy of the charging balance is calculated, not measured; a meter at the wallbox shows more."
S2_SCHRITT1 = "Containers from page “VolkswagenID”, step 2 (do not import again). For charge limit, charging current and charging, in the plugin tab “%s” set the tick “%s” – off by default; otherwise the plugin rejects the commands."
S2_SCHRITT2 = "Create the page “VolkswagenID Laden”. Drag 22 commands: no. 1, 16 and 17 from “Volkswagen 1 Status”, no. 2–15 from “Volkswagen 1 Laden”, no. 18–22 from “Volkswagen 1 Verbrauch” (VW_1_SOC, VW_1_LD_LAEDT, VW_1_LD_FERTIGMIN, VW_1_LD_KABEL and VW_1_ZUHAUSE once more); plus the three virtual output commands no. 27, 29 and 36 from “Volkswagen 1 Befehle”."
S2_SCHRITT3 = "Create two sliders (“Ladegrenze (VW) (Proz)”, “Ladestrom (VW) (A)”) and two switches (“Laden nach Empfehlung (VW)”, “Laden von Hand (VW)”) as virtual inputs, values as in the list."
S2_SCHRITT4 = "Remaining blocks via F5, connect from top to bottom. Click “+”: “Laden (VW)” four times, “Ladeanschluss (VW)” four times, “Ladebilanz (VW)” once. Switch on “Statistics” for VW_1_LD_LADEKW and VW_1_VB_TAGKWH."
S2_SCHRITT5 = "Save and transfer. Check: plug in the cable – after the next poll (up to 5 minutes) “Laden (VW)” shows “Kabel steckt, lädt nicht” or “lädt mit … kW”; switching “Laden von Hand (VW)” on starts charging."
S3_H1 = "On no. 14 and 15: the climate command is analogue and needs the temperature as a value, not a pulse. The formula delivers it while requested, otherwise -1 – the plugin rejects this value without effect. Switching off is done via “Klima aus (VW)” or the vehicle’s own timeout."
S3_H2 = "If you use the plugin’s own pre-conditioning (section “%s”, for example with the departure assistant), leave out the schedule no. 10 – otherwise two paths request it."
S3_H3 = "“VW 1 Zieltemperatur setzen” stays unused in the template: “Klima jetzt” sends the temperature along."
S3_H4 = "The seat heating is read only; Volkswagen offers no way to switch it. Use “Fahrzeug wecken” sparingly – every wake-up costs standby current."
S3_H5 = "Lock and unlock, light flash and horn are left out on purpose: they need the second tick “%s” in the plugin (and the S-PIN) and do not belong on an app button. If you want them, set the tick and fetch the command template again."
S3_H6 = "The announcements (“charging finished”, “climate control finished”, “standing open” …) are spoken by the plugin itself (tab “%s”, voice output, off by default) – no block is needed for them."
S3_SCHRITT1 = "Containers as on page “VolkswagenID”; tick “%s” as on page “VolkswagenID Laden” (only “Jetzt abrufen” does not need it)."
S3_SCHRITT2 = "Create the page “VolkswagenID Klima und Befehle”. Drag the 6 commands no. 1–6 from “Volkswagen 1 Status” and the 8 virtual output commands no. 15, 17, 19, 21, 23, 25, 27 and 29 from “Volkswagen 1 Befehle”; drag “Anwesenheit (eigene Quelle)” from the tree, or create it once as a virtual input and feed it from your own presence."
S3_SCHRITT3 = "Create the slider “Zieltemperatur (VW)”, four switches (no. 18, 20, 22, 24) and four push buttons (no. 9, 16, 26, 28) as virtual inputs, values as in the list."
S3_SCHRITT4 = "Place the Schedule “Abfahrt vorklimatisieren (VW)” via F5 and enter Monday to Friday 06:40–07:00 in the schedule editor (your own departure: start 20 minutes before, end at departure); its output AQ goes to AND no. 12. Remaining blocks via F5. Status “Klima (VW)”: click “+” three times first."
S3_SCHRITT5 = "Save and transfer. Check: tap “Klima jetzt (VW)” – after the next poll (up to 5 minutes) “Klima (VW)” shows “Klimatisierung läuft”; “Klima aus (VW)” stops it."
S4_H1 = "The open message only applies to a parked car with fresh data (formula no. 25); while driving, before the first poll and during a fault it stays silent."
S4_H2 = "Without a home location in the plugin, “at home” and the distance stay 0; “Standort und Kilometer (VW)” then says “Standort unbekannt”."
S4_H3 = "On no. 29: an electric car delivers no oil service; 0 means “not delivered”. An inspection due exactly today counts the same – it was already reported 14 days before."
S4_H4 = "On no. 30 and 31: the Threshold Switch gives a short pulse at every poll; the 600 s Switch-On Delay swallows it."
S4_SCHRITT1 = "Containers as on page “VolkswagenID”. The maintenance template only polls hourly – the values change in days."
S4_SCHRITT2 = "Create the page “VolkswagenID Fahrzeug”. Drag 20 commands: no. 1–14 from “Volkswagen 1 Status” (VW_1_ZUSTAND, VW_1_OK and VW_1_ZUHAUSE once more), no. 15–20 from “Volkswagen 1 Wartung”. Switch on “Statistics” for VW_1_KM."
S4_SCHRITT3 = "Create two notifications: “Meldung Fahrzeug offen (VW)” and “Meldung Service fällig (VW)”, texts as in the list."
S4_SCHRITT4 = "Remaining blocks via F5, connect from top to bottom. Click “+”: “Türen und Fenster (VW)” four times, “Standort und Kilometer (VW)” twice, “Wartung (VW)” three times."
S4_SCHRITT5 = "Save and transfer. Check: leave the parked car unlocked – after the next poll and 5 minutes “Meldung Fahrzeug offen (VW)” arrives."
SCHRITTE_TITEL = "How to take over this page"
Z1_01 = "Virtual HTTP input command (template “Volkswagen 1 Status”) | VW_1_OK | 1 = last poll succeeded and is at most three times as old as the polling interval (300 s by default) | —"
Z1_02 = "Virtual HTTP input command (template “Volkswagen 1 Status”) | VW_1_ZAEHLER | run counter 0 to 999, one up per pass of the service (also during a fault); -1 = never run – the sign of life | —"
Z1_03 = "Virtual HTTP input command (template “Volkswagen 1 Status”) | VW_1_ALTER | seconds since the last successful poll | —"
