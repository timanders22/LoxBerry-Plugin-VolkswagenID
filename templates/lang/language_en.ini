[VW_BEF]
ABRUF = "Poll immediately"
ABRUF_H = "Fetches the values at once instead of waiting for the next cycle. Needs no write permission, but is subject to the configured minimum gap."
BLINKEN = "Light flash"
BLINKEN_H = "Flashes the hazard lights so the car can be found in a car park. Needs the second checkbox."
EINSTELLUNG = "Set a yes/no property"
EINSTELLUNG_H = "Sets one of the car's four yes/no properties. The name is part of the address, the value arrives as 0 or 1."
ENTRIEGELN = "Unlock"
ENTRIEGELN_H = "Unlocks the car. Needs the second checkbox and the four-digit S-PIN."
HUPEN = "Horn and light flash"
HUPEN_H = "Sounds the horn and flashes. The interface offers no horn without lights. Needs the second checkbox."
KLIMA_START = "Climate control on"
KLIMA_START_H = "Starts stationary climate control at the target temperature passed, in degrees Celsius. The value must lie within the configured limits."
KLIMA_STOP = "Climate control off"
KLIMA_STOP_H = "Stops stationary climate control."
LADEGRENZE = "Set charge limit"
LADEGRENZE_H = "The percentage up to which the car charges. Volkswagen rounds to the steps the car knows — usually multiples of ten, and many models only accept 50 per cent and above."
LADEN_START = "Start charging"
LADEN_START_H = "Requests charging. Without a plugged-in cable the car rejects it."
LADEN_STOP = "Stop charging"
LADEN_STOP_H = "Stops charging. The cable stays locked as long as the plug unlock setting requires it."
LADESTROM = "Set charging current"
LADESTROM_H = "Permitted are 5, 6, 10, 13, 16 and 32 amperes. Which of them your car knows depends on the model: some carry the current in amperes, the others only know reduced (6) and maximum (16)."
SCHEIBE_AUS = "Windscreen heating off"
SCHEIBE_AUS_H = "Switches off the windscreen heating."
SCHEIBE_EIN = "Windscreen heating on"
SCHEIBE_EIN_H = "Switches on the windscreen heating, as far as the car has one."
VERRIEGELN = "Lock"
VERRIEGELN_H = "Locks the car. Needs the second checkbox and the four-digit S-PIN."
WECKEN = "Wake the car"
WECKEN_H = "Wakes the car from sleep so that it reports fresh values. Use sparingly: every wake-up costs standby power."
ZIELTEMP = "Set target temperature"
ZIELTEMP_H = "Sets the target temperature without starting climate control. It then also applies to the next start made at the car itself."

