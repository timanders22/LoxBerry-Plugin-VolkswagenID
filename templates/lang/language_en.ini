GRUND_TEMP = "the minimum temperature is above the maximum temperature"
GRUND_ZAHL = "not a number from %s to %s"
HAUS_EINE_QUELLE = "Use only one source: timer in Loxone <b>or</b> this pre-conditioning – otherwise two commands arrive. At most two “climate on” per departure (send – query – send); it counts as done only once Volkswagen has accepted the order."
HEIMAT_ERKLAERUNG = "If latitude and longitude of the home location are stored, the service calculates the distance of the car in metres and derives a <span class='sm-mono'>ZUHAUSE</span> of 0 or 1 from it. That saves the arithmetic in the Miniserver and turns a position into a digital input. Without a home location both values stay empty — not 0: a 0 would mean <i>not at home</i>, and nobody knows that."
H_ABFAHRT = "Pre-conditioning before departure"
H_ABFAHRT_FAHRZEUG = "The number as in the section “Detected vehicles” (1 = first vehicle). If it is not in the account, nothing is sent. Up to 0.9.32 it was always the lowest number in the account."
H_ABFAHRT_TEMP = "Must lie within the limits set above, otherwise the service rejects the request. It always applies to vehicle 1."
H_ABFAHRT_THEMA = "The value must be a number of minutes. A negative value is ignored — it would mean the departure is in the past."
H_ABSTAND_ABRUF = "Applies only to the <span class='sm-mono'>abruf</span> command. 0 disables the limit."
H_ANKUNFT = "Query on arrival"
H_ANKUNFT_EIN = "If a selected person or tag changes live from 0 to 1, the plugin queries the account once – at most once per 30 minutes and only if the data is older than 5 minutes. The query takes the same path as an immediate query (the minimum interval applies); it does not need <i>Allow write commands</i>. Off by default."
H_ANKUNFT_QUELLE = "Up to four entries, comma-separated: <span class='sm-mono'>tag:&lt;name&gt;</span> (BLE scanner, <span class='sm-mono'>haus/tag/&lt;name&gt;/da</span>) or <span class='sm-mono'>person:&lt;name&gt;</span> (<span class='sm-mono'>haus/anwesenheit/&lt;name&gt;</span>)."
H_ANSAGE = "Speech output (announcements, off by default)"
H_ANSAGE_ANLAESSE = "Events"
H_ANSAGE_ANLAESSE_HILFE = "Each event can be deselected; it only takes effect once an output is chosen above. The test announcement is on the <i>Test</i> tab."
H_BEFEHLE_STUNDE = "Counted over a sliding hour, not per clock hour. The immediate poll does not count towards it — it has its own limit."
H_BREMSE = "Rate limiting"
H_DIENST = "Polling service"
H_EINGREIFEND = "Intrusive commands"
H_EINGREIFEND_EIN = "Additionally requires that write commands are permitted at all. Locking and unlocking also requires the four-digit S-PIN. The Volkswagen connector offers both commands (checked against version 0.10.6 on 06.09.2026). Their effect on the car is <b>unverified</b>: no car was available here. If Volkswagen rejects them, the service says so in plain words instead of claiming anything."
H_EMAIL = "The e-mail address the Volkswagen account was created with."
H_EMPFEHLUNG = "Charging recommendation"
H_EMPF_KLEINER = "Ticked for a price (cheap is good), unticked for a surplus (plenty is good). Topic and threshold belong together; either one alone has no effect and is rejected."
H_EMPF_THEMA = "Full topic name, no wildcards. Leaving it empty disables the feature. The topics of this house's spot-price plugins can be used directly."
H_ENTPRELLUNG = "The same command carrying the same value is not sent again within this time. A <i>different</i> value goes through at once — so the limiter never delays a real change. 0 disables it."
H_ERKANNT = "Detected vehicles"
H_G41 = "House form: departure, presence, arrival, electricity price, SignalBot"
H_HAUS = "House topics (departure, presence, weather)"
H_HAUS_ABFAHRT_EIN = "Reads <span class='sm-mono'>haus/abfahrt/in_min</span> (departure assistant, tick “give departure to other plugins” there). Valid only while <span class='sm-mono'>haus/abfahrt/zaehler</span> changes live (120 s); otherwise the topic above applies as fallback – it is dropped with the next version. Off by default."
H_HAUS_STROMPREIS_EIN = "During a charge at home the plugin notes the end price from <span class='sm-mono'>haus/strompreis</span> every minute and shows cost and average price after the charge (charges table, topics <span class='sm-mono'>fahrzeug&lt;n&gt;/ladung_kosten</span> and <span class='sm-mono'>ladung_preis</span>). The amount is the reported charging power × time (Volkswagen reports no battery size); if the price is missing for more than a tenth of the energy, the cost stays -1 – never estimated. Needs the home position. Off by default."
H_HEIMAT = "Home location"
H_HEIM_KOORDINATEN = "Decimal degrees with a dot, for example <span class='sm-mono'>51.318339</span> and <span class='sm-mono'>9.489601</span>. The two fields belong together: only one of them yields no distance and is rejected. Leaving both empty disables the feature."
H_HEIM_RADIUS = "Locating a car is accurate to a few metres, considerably worse under trees or in a garage. 150 metres is a usable starting point; too small a radius makes the car flicker in its own driveway."
H_INTERVALL = "Time between two polls. Allowed: 180 to 3600 seconds — 180 is the library's lower limit, not a precaution added by this plugin."
H_KONTO = "Volkswagen account access"
H_LADEEMPF_QUELLE = "With <i>haus/strompreis</i> the plugin compares the end price of the current hour (spot price plugin, tick “give electricity price to other plugins” there) with the limit above. If the source is silent, the recommendation goes out as 0 – as with the own topic."
H_MQTT_RETAIN = "When ticked, the broker remembers every value. After a restart of the Miniserver or the gateway the virtual inputs immediately hold the last known state; without this they stay empty until the next poll completes — with a five-minute cycle that means several minutes. The heartbeat still tells you whether the value is fresh. Measured on the LoxBerry: the gateway's UDP input knows the keyword <span class='sm-mono'>retain</span>, and a topic sent that way is held by the broker afterwards. The heartbeat is never retained, even with this ticked — a retained heartbeat would always say “alive”. Since 0.9.24 the same holds for everything the <b>service says about itself</b> (<span class='sm-mono'>ok</span>, <span class='sm-mono'>fehler_folge</span>, <span class='sm-mono'>fehlertext</span>, <span class='sm-mono'>ausfalltext</span>); which topic is retained is shown in the <b>Retained</b> column of the table below. Uninstalling clears the retained topics of this plugin."
H_MQTT_TOPIC = "Letters, digits, hyphen, underscore and slash are allowed. All topics derive from this prefix, see the MQTT tab."
H_PASSWORT = "Leaving the field empty keeps the stored password. It is never displayed — the Test tab only shows its length."
H_SICHERUNG = "Back up and restore settings"
H_SIGNAL = "Messages to SignalBot"
H_SIGNAL_EIN = "Off by default. The events below can be deselected one by one."
H_SIGNAL_PRAEFIX = "As set in SignalBot (default <span class='sm-mono'>signalbot</span>)."
H_SPIN = "The four-digit S-PIN from the Volkswagen app. It is only needed for locking and unlocking, which sit behind the second checkbox in the <i>Intervening commands</i> section. Leave the field empty if you do not use those commands."
H_STEUERUNG = "Write commands"
H_STROMPREIS = "Electricity price and charging cost"
H_TAKT = "Polling interval"
H_TAKT_WARTUNG = "Inspection and oil service change in days, not minutes. With a 300 second interval, 12 means once per hour."
H_TEMP = "Limits for the air conditioning. A value outside them is <b>rejected</b>, not clamped: a silently altered setpoint leads to a car doing something other than what is displayed."
H_VERLAUF_TAGE = "How long the readings for the small daily chart are kept."
H_VORKLIMA_ANWESEND_EIN = "If <span class='sm-mono'>haus/anwesenheit/jemand</span> reports 0 live, pre-conditioning waits (no attempt used). If the source is silent, it behaves as without the tick. Off by default."
H_VORKLIMA_WETTER_EIN = "Outside temperature first from Loxone (command <span class='sm-mono'>aussentemp</span> via the command bridge, valid 30 min), otherwise from the vehicle (snapshot at most 60 min old). Between the two limits nothing is conditioned; without a statement it is conditioned. Off by default."
H_WARTEZEIT = "How long the interface waits for the service to answer a command. After that it reports <span class='sm-mono'>OK=2</span> — queued, outcome unknown. No success is reported that nobody has verified."
H_WARTEZEIT_ENDPUNKT = "How long the <b>Miniserver endpoint</b> waits for the service to answer before it reports <span class='sm-mono'>OK=2</span>. This is a separate, shorter time than the one used by this page: a Virtual Output in Loxone hangs for exactly this long. Entering 0 gives you <span class='sm-mono'>OK=2</span> immediately — the command still runs, but nobody reports the outcome back."
H_ZUGANG_LOESCHEN = "Removes e-mail, password and S-PIN completely — including the backup copy and the stored login tokens (<span class='sm-mono'>token.json</span>), which grant access to the account even without the password. An empty password field on its own deletes nothing; that would happen by accident far too easily. Anything typed in the same step is discarded."
H_ZUGRIFF_ERZWINGEN = "Some cars do not announce the <span class='sm-mono'>ACCESS</span> capability although they do report locking and door status. The connector offers a switch for this. Only enable it if those fields stay empty otherwise — else the plugin asks for something that does not exist."
KEINE_FAHRZEUGE = "No vehicle detected yet. That is normal until the first successful poll: enter the credentials, save, start the service and wait one interval. If the list is still empty afterwards, the reason is in the Test tab and in the log file."
KONTO_ERKLAERUNG = "These are the credentials of your <b>Volkswagen account</b> — the same ones you use in the <i>Volkswagen</i> or <i>We Connect ID</i> app. Not those of a dealer portal. They are stored in a separate file with mode 0600, not in the configuration this page displays. <b>Two notes:</b> the connector works with <b>European</b> vehicles — there is a separate one for North America which is not included here. And some accounts ask for two-factor confirmation, which cannot be automated; if that affects you, sign in once in a browser on this machine."
